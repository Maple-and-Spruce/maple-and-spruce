name: Check builds on PR

on:
  pull_request:
    branches:
      - '**'

env:
  NX_DAEMON: 'false'

jobs:
  install:
    name: Install Dependencies
    runs-on: ubuntu-latest
    if: github.repository == 'Maple-and-Spruce/maple-and-spruce'
    outputs:
      cache_key: ${{ steps.set_cache_key.outputs.key }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Generate cache key
        id: set_cache_key
        run: echo "key=${{ runner.os }}-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}" >> $GITHUB_OUTPUT

      - name: Restore node_modules cache
        id: restore-cache
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ steps.set_cache_key.outputs.key }}

      - name: Install dependencies
        if: steps.restore-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Save node_modules cache
        if: steps.restore-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: node_modules
          key: ${{ steps.set_cache_key.outputs.key }}

  security:
    name: Security Audit
    needs: [install]
    runs-on: ubuntu-latest
    if: github.repository == 'Maple-and-Spruce/maple-and-spruce'
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Restore node_modules cache
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ needs.install.outputs.cache_key }}

      - name: Run pnpm audit
        run: pnpm audit --audit-level=high

  typecheck:
    name: TypeScript Check
    needs: [install]
    runs-on: ubuntu-latest
    if: github.repository == 'Maple-and-Spruce/maple-and-spruce'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive nx affected SHAs
        uses: nrwl/nx-set-shas@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Restore node_modules cache
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ needs.install.outputs.cache_key }}

      - name: TypeScript typecheck (affected)
        run: pnpm exec nx affected -t typecheck

  lint:
    name: ESLint
    needs: [install]
    runs-on: ubuntu-latest
    if: github.repository == 'Maple-and-Spruce/maple-and-spruce'
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Restore node_modules cache
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ needs.install.outputs.cache_key }}

      - name: Run ESLint
        # --max-warnings=-1 = unlimited warnings allowed; errors still fail.
        # SonarJS recommended set was just added with many rules in warn mode
        # for gradual adoption. Drop the flag once warnings are driven to zero.
        run: pnpm exec eslint . --max-warnings=-1

  build:
    name: Build
    needs: [install]
    runs-on: ubuntu-latest
    if: github.repository == 'Maple-and-Spruce/maple-and-spruce'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive nx affected SHAs
        uses: nrwl/nx-set-shas@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Restore node_modules cache
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ needs.install.outputs.cache_key }}

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Build affected projects
        run: pnpm exec nx affected -t build

  webflow-components-typecheck:
    name: Webflow Components Typecheck
    needs: [install]
    runs-on: ubuntu-latest
    if: github.repository == 'Maple-and-Spruce/maple-and-spruce'
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Restore node_modules cache
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ needs.install.outputs.cache_key }}

      # Webflow's CLI `library bundle` command is broken upstream with
      # current webpack / Module Federation transitive versions (fails
      # with "no files found for remoteEntry chunk"). The actual
      # `library share` command on merge has its own working pipeline.
      # A typecheck is the best PR-time gate we have against shipping
      # broken component code.
      - name: Typecheck webflow components
        run: pnpm exec tsc --noEmit -p apps/webflow-components/tsconfig.json

  unit-tests:
    name: Unit Tests & Coverage
    needs: [install]
    runs-on: ubuntu-latest
    if: github.repository == 'Maple-and-Spruce/maple-and-spruce'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Restore node_modules cache
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ needs.install.outputs.cache_key }}

      - name: Run unit tests with coverage
        run: pnpm exec vitest run --coverage

      - name: Upload unit coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage/unit/coverage-final.json
          if-no-files-found: error

  integration-test-matrix:
    name: Plan Integration Tests
    needs: [install]
    runs-on: ubuntu-latest
    if: github.repository == 'Maple-and-Spruce/maple-and-spruce'
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive nx affected SHAs
        uses: nrwl/nx-set-shas@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Restore node_modules cache
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ needs.install.outputs.cache_key }}

      - name: Generate test matrix
        id: matrix
        run: echo "matrix=$(node tools/ci-integration-test-matrix.js --max-per-group 5 --affected)" >> $GITHUB_OUTPUT

  integration-tests:
    name: Integration Tests (${{ matrix.group.index }}/${{ matrix.group.total }})
    needs: [install, integration-test-matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.repository == 'Maple-and-Spruce/maple-and-spruce'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.integration-test-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Restore node_modules cache
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ needs.install.outputs.cache_key }}

      - name: Build functions
        run: |
          pnpm exec nx run functions:build
          pnpm exec nx run functions-square:build
          pnpm exec nx run functions-sync:build
          pnpm exec nx run functions-calendar:build

      - name: Create emulator .env
        run: |
          # Copy .env.dev to every codebase (has all shared project-level params)
          # Strip comments and blank lines — Firebase .env parser needs clean key=value pairs
          for dir in dist/apps/functions dist/apps/functions-square dist/apps/functions-sync dist/apps/functions-calendar; do
            grep -v '^#' .env.dev | grep -v '^$' > "$dir/.env"
          done

          # maple-core: Etsy mock server URL + fake secrets
          echo "ETSY_API_BASE=http://localhost:9998/v3/application" >> dist/apps/functions/.env
          printf "ETSY_API_KEY=fake\nETSY_SHARED_SECRET=fake\n" > dist/apps/functions/.secret.local

          # maple-square: mock server URL + fake secrets
          echo "SQUARE_BASE_URL=http://localhost:9999" >> dist/apps/functions-square/.env
          echo "ETSY_API_BASE=http://localhost:9998/v3/application" >> dist/apps/functions-square/.env
          printf "SQUARE_ACCESS_TOKEN=mock-token\nSQUARE_WEBHOOK_SIGNATURE_KEY=mock-key\nETSY_API_KEY=fake\nETSY_SHARED_SECRET=fake\n" > dist/apps/functions-square/.secret.local

          # maple-sync: mock server URL + fake secrets
          echo "WEBFLOW_BASE_URL=http://localhost:9999" >> dist/apps/functions-sync/.env
          echo "ETSY_API_BASE=http://localhost:9998/v3/application" >> dist/apps/functions-sync/.env
          echo "ETSY_TOKEN_URL=http://localhost:9998/v3/public/oauth/token" >> dist/apps/functions-sync/.env
          printf "WEBFLOW_API_TOKEN=mock-token\nETSY_API_KEY=fake\nETSY_SHARED_SECRET=fake\n" > dist/apps/functions-sync/.secret.local

      - name: Start mock servers and run integration tests
        run: |
          # Start mock HTTP servers (Square + Webflow + Etsy APIs)
          npx tsx libs/firebase/integration-test-mock-server/start.ts &
          MOCK_PID=$!
          ETSY_MOCK_SERVER_PORT=9998 npx tsx libs/firebase/etsy-test-mock-server/start.ts &
          ETSY_MOCK_PID=$!
          sleep 2

          # Run the suites assigned to this matrix group
          npx firebase emulators:exec --project=dev --only auth,firestore,functions \
            "node tools/run-integration-test-suites.js ${{ matrix.group.suites }}"
          EXIT_CODE=$?

          kill $MOCK_PID 2>/dev/null || true
          kill $ETSY_MOCK_PID 2>/dev/null || true
          exit $EXIT_CODE

  integration-tests-result:
    name: Integration Tests
    needs: [integration-test-matrix, integration-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check matrix result
        run: |
          matrix="${{ needs.integration-test-matrix.result }}"
          tests="${{ needs.integration-tests.result }}"
          echo "integration-test-matrix: $matrix"
          echo "integration-tests: $tests"

          # Fail on actual failures or cancellations — skipped is OK (no affected suites or repo filter)
          if [[ "$matrix" == "failure" || "$matrix" == "cancelled" ]]; then
            echo "::error::Matrix setup failed"
            exit 1
          fi
          if [[ "$tests" == "failure" || "$tests" == "cancelled" ]]; then
            echo "::error::One or more integration test groups failed"
            exit 1
          fi

  storybook:
    name: Storybook Build & Tests
    needs: [install]
    runs-on: ubuntu-latest
    if: github.repository == 'Maple-and-Spruce/maple-and-spruce'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive nx affected SHAs
        uses: nrwl/nx-set-shas@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Restore node_modules cache
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ needs.install.outputs.cache_key }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build Storybook (affected)
        run: pnpm exec nx affected -t build-storybook

      - name: Run Storybook interaction tests with coverage
        run: pnpm exec vitest run --config vitest.storybook.config.ts --coverage --coverage.reportsDirectory=${{ github.workspace }}/coverage/storybook

      - name: Upload Storybook coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-storybook
          path: coverage/storybook/coverage-final.json
          if-no-files-found: error

  coverage-check:
    name: Merged Coverage Check
    needs: [install, unit-tests, storybook]
    runs-on: ubuntu-latest
    if: github.repository == 'Maple-and-Spruce/maple-and-spruce'
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Restore node_modules cache
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ needs.install.outputs.cache_key }}

      - name: Download unit coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-unit
          path: coverage/unit

      - name: Download Storybook coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-storybook
          path: coverage/storybook

      - name: Prepare and merge coverage reports
        run: |
          mkdir -p coverage/to-merge coverage/merged
          cp coverage/unit/coverage-final.json coverage/to-merge/unit.json
          cp coverage/storybook/coverage-final.json coverage/to-merge/storybook.json
          pnpm exec nyc merge coverage/to-merge coverage/merged/coverage-final.json
          pnpm exec nyc report -t coverage/merged --reporter=text

      - name: Check coverage thresholds (80%)
        run: |
          pnpm exec nyc check-coverage \
            --lines 80 \
            --functions 80 \
            --statements 80 \
            --branches 50 \
            -t coverage/merged
