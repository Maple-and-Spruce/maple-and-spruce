name: Check builds on PR

on:
  pull_request:
    branches:
      - '**'

jobs:
  install:
    name: Install Dependencies
    runs-on: ubuntu-latest
    if: github.repository == 'Maple-and-Spruce/maple-and-spruce'
    outputs:
      cache_key: ${{ steps.set_cache_key.outputs.key }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Generate cache key
        id: set_cache_key
        run: echo "key=${{ runner.os }}-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}" >> $GITHUB_OUTPUT

      - name: Restore node_modules cache
        id: restore-cache
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ steps.set_cache_key.outputs.key }}

      - name: Install dependencies
        if: steps.restore-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Save node_modules cache
        if: steps.restore-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: node_modules
          key: ${{ steps.set_cache_key.outputs.key }}

  security:
    name: Security Audit
    needs: [install]
    runs-on: ubuntu-latest
    if: github.repository == 'Maple-and-Spruce/maple-and-spruce'
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Restore node_modules cache
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ needs.install.outputs.cache_key }}

      - name: Run pnpm audit
        run: pnpm audit --audit-level=high

  typecheck:
    name: TypeScript Check
    needs: [install]
    runs-on: ubuntu-latest
    if: github.repository == 'Maple-and-Spruce/maple-and-spruce'
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Restore node_modules cache
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ needs.install.outputs.cache_key }}

      - name: TypeScript typecheck
        run: pnpm exec nx run maple-spruce:typecheck

  build:
    name: Build
    needs: [install]
    runs-on: ubuntu-latest
    if: github.repository == 'Maple-and-Spruce/maple-and-spruce'
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Restore node_modules cache
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ needs.install.outputs.cache_key }}

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Build web app
        run: pnpm exec nx run maple-spruce:build

      - name: Build functions
        run: pnpm exec nx run functions:build

  unit-tests:
    name: Unit Tests & Coverage
    needs: [install]
    runs-on: ubuntu-latest
    if: github.repository == 'Maple-and-Spruce/maple-and-spruce'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Restore node_modules cache
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ needs.install.outputs.cache_key }}

      - name: Run unit tests with coverage
        run: pnpm exec vitest run --coverage

      - name: Report coverage
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          vite-config-path: vitest.config.ts
          file-coverage-mode: changes

  integration-tests:
    name: Integration Tests
    needs: [install]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.repository == 'Maple-and-Spruce/maple-and-spruce'
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Restore node_modules cache
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ needs.install.outputs.cache_key }}

      - name: Build functions
        run: |
          pnpm exec nx run functions:build
          pnpm exec nx run functions-square:build
          pnpm exec nx run functions-sync:build
          pnpm exec nx run functions-calendar:build

      - name: Create emulator .env
        run: |
          echo "ALLOWED_ORIGINS=http://localhost:3000" > dist/apps/functions/.env
          echo "SQUARE_ENV=LOCAL" >> dist/apps/functions/.env
          echo "SQUARE_LOCATION_ID=fake" >> dist/apps/functions/.env
          echo "SALES_TAX_RATE=0.06" >> dist/apps/functions/.env
          echo "SQUARE_ACCESS_TOKEN=mock-token" > dist/apps/functions-square/.secret.local
          echo "SQUARE_WEBHOOK_SIGNATURE_KEY=mock-key" >> dist/apps/functions-square/.secret.local
          echo "SQUARE_ENV=LOCAL" >> dist/apps/functions-square/.env
          echo "SQUARE_LOCATION_ID=fake" >> dist/apps/functions-square/.env
          echo "SQUARE_BASE_URL=http://localhost:9999" >> dist/apps/functions-square/.env
          echo "ALLOWED_ORIGINS=http://localhost:3000" >> dist/apps/functions-square/.env
          echo "ALLOWED_ORIGINS=http://localhost:3000" > dist/apps/functions-sync/.env
          echo "WEBFLOW_API_TOKEN=mock-token" > dist/apps/functions-sync/.secret.local
          echo "ETSY_API_KEY=fake" >> dist/apps/functions-sync/.secret.local
          echo "ETSY_SHARED_SECRET=fake" >> dist/apps/functions-sync/.secret.local
          echo "WEBFLOW_SITE_ID=fake" >> dist/apps/functions-sync/.env
          echo "WEBFLOW_ARTISTS_COLLECTION_ID=fake" >> dist/apps/functions-sync/.env
          echo "WEBFLOW_CLASSES_COLLECTION_ID=fake" >> dist/apps/functions-sync/.env
          echo "WEBFLOW_BASE_URL=http://localhost:9999" >> dist/apps/functions-sync/.env
          echo "ETSY_REDIRECT_URI=http://localhost:3000/etsy/callback" >> dist/apps/functions-sync/.env
          echo "ALLOWED_ORIGINS=http://localhost:3000" > dist/apps/functions-calendar/.env
          echo "GOOGLE_CALENDAR_ADHOC_ICS_URL=" >> dist/apps/functions-calendar/.env

      - name: Start mock server and run integration tests
        run: |
          npx tsx libs/firebase/integration-test-mock-server/start.ts &
          MOCK_PID=$!
          sleep 2
          npx firebase emulators:exec --project=dev --only auth,firestore,functions "pnpm exec nx run functions-integration-tests:test"
          EXIT_CODE=$?
          kill $MOCK_PID 2>/dev/null
          exit $EXIT_CODE

  storybook:
    name: Storybook Build & Tests
    needs: [install]
    runs-on: ubuntu-latest
    if: github.repository == 'Maple-and-Spruce/maple-and-spruce'
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Restore node_modules cache
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ needs.install.outputs.cache_key }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build Storybook
        run: pnpm exec nx run maple-spruce:build-storybook

      - name: Serve Storybook and run interaction tests
        run: |
          pnpm exec concurrently -k -s first -n "SB,TEST" \
            "pnpm exec http-server apps/maple-spruce/storybook-static --port 6006 --silent" \
            "pnpm exec wait-on tcp:6006 && pnpm exec test-storybook --config-dir apps/maple-spruce/.storybook --ci"
