name: Check builds on PR

on:
  pull_request:
    branches:
      - '**'

# One in-flight run per PR. This workflow fans out to 19 jobs (builds, unit +
# Storybook coverage, four E2E suites, integration-test matrix), so every push
# to a PR used to start a second full copy while the first kept burning
# runners — and both raced for the same shared dev resources.
#
# `cancel-in-progress: true` is correct HERE and wrong on the deploy workflow:
# a superseded PR result is worthless (the branch already moved on), whereas a
# half-cancelled deploy leaves functions stranded. Note this is the opposite
# setting from `deploy-on-merge` in firebase-functions-merge.yml, deliberately.
#
# `github.ref` is the PR's merge ref, so each PR gets its own group and PRs
# never cancel each other. Matters most with several agents iterating on
# separate PRs at once.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NX_DAEMON: 'false'

jobs:
  install:
    name: Install Dependencies
    runs-on: ubuntu-latest
    if: github.repository == 'Maple-and-Spruce/maple-and-spruce'
    outputs:
      cache_key: ${{ steps.set_cache_key.outputs.key }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Generate cache key
        id: set_cache_key
        run: echo "key=${{ runner.os }}-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}" >> $GITHUB_OUTPUT

      - name: Restore node_modules cache
        id: restore-cache
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ steps.set_cache_key.outputs.key }}

      - name: Install dependencies
        if: steps.restore-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Save node_modules cache
        if: steps.restore-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: node_modules
          key: ${{ steps.set_cache_key.outputs.key }}

  security:
    name: Security Audit
    needs: [install]
    runs-on: ubuntu-latest
    if: github.repository == 'Maple-and-Spruce/maple-and-spruce'
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Restore node_modules cache
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ needs.install.outputs.cache_key }}

      # Not `pnpm audit` inline: the npm advisories endpoint times out often
      # enough to red-X unrelated PRs (it killed this job on #801 after 4m42s),
      # and `pnpm audit` exits 1 for that exactly as it does for a real CVE.
      # The wrapper retries, keeps failing on genuine advisories, and downgrades
      # a registry outage to a warning annotation. See the header comment there.
      - name: Run pnpm audit
        run: ./tools/run-security-audit.sh

  firestore-indexes:
    name: Firestore Indexes
    needs: [install]
    runs-on: ubuntu-latest
    if: github.repository == 'Maple-and-Spruce/maple-and-spruce'
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Restore node_modules cache
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ needs.install.outputs.cache_key }}

      # Every composite-index-requiring Firestore query in repositories,
      # Cloud Functions, and tools must have a matching entry in
      # firestore.indexes.json. The Firestore emulator does NOT enforce
      # composite indexes, so a green test suite is not proof the query
      # will run in prod. See .claude/rules/firebase-functions.md.
      - name: Check Firestore indexes
        # tsx isn't a project dep — npx fetches it on demand (same pattern as
        # integration-tests step). Other CI jobs use it via `npx tsx`.
        run: npx tsx tools/check-firestore-indexes.ts

  function-count:
    name: Function Count
    needs: [install]
    runs-on: ubuntu-latest
    if: github.repository == 'Maple-and-Spruce/maple-and-spruce'
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      # One Cloud Run service per function library. The gen-2 deploy write
      # quota is 60/60s and CANNOT be raised, so the function count sets a
      # hard floor on how long a full deploy takes. ADR-029 consolidates
      # endpoints into domain routers (#724); this ratchet stops the count
      # drifting back up while that work is in flight. Resolve either
      # direction with: npx tsx tools/check-function-count.ts --fix
      - name: Check Cloud Function count ratchet
        run: npx tsx tools/check-function-count.ts

  callable-roles:
    name: Callable Roles
    needs: [install]
    runs-on: ubuntu-latest
    if: github.repository == 'Maple-and-Spruce/maple-and-spruce'
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Restore node_modules cache
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ needs.install.outputs.cache_key }}

      # Every function exported from a codebase entry point must declare a role
      # (requiringRole / createAdminFunction / createRoleFunction), be a trigger,
      # or be explicitly allowlisted as public / auth-only. Prevents a new
      # callable shipping reachable without a role check. See epic #617.
      - name: Check callable roles
        run: npx tsx tools/check-callable-roles.ts

  typecheck:
    name: TypeScript Check
    needs: [install]
    runs-on: ubuntu-latest
    if: github.repository == 'Maple-and-Spruce/maple-and-spruce'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive nx affected SHAs
        uses: nrwl/nx-set-shas@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Restore node_modules cache
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ needs.install.outputs.cache_key }}

      - name: TypeScript typecheck (affected)
        run: pnpm exec nx affected -t typecheck

  lint:
    name: ESLint
    needs: [install]
    runs-on: ubuntu-latest
    if: github.repository == 'Maple-and-Spruce/maple-and-spruce'
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Restore node_modules cache
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ needs.install.outputs.cache_key }}

      - name: Run ESLint
        # --max-warnings=-1 = unlimited warnings allowed; errors still fail.
        # SonarJS recommended set was just added with many rules in warn mode
        # for gradual adoption. Drop the flag once warnings are driven to zero.
        run: pnpm exec eslint . --max-warnings=-1

  build:
    name: Build
    needs: [install]
    runs-on: ubuntu-latest
    if: github.repository == 'Maple-and-Spruce/maple-and-spruce'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive nx affected SHAs
        uses: nrwl/nx-set-shas@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Restore node_modules cache
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ needs.install.outputs.cache_key }}

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Build affected projects
        run: pnpm exec nx affected -t build

  webflow-components-typecheck:
    name: Webflow Components Typecheck
    needs: [install]
    runs-on: ubuntu-latest
    if: github.repository == 'Maple-and-Spruce/maple-and-spruce'
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Restore node_modules cache
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ needs.install.outputs.cache_key }}

      # Webflow's CLI `library bundle` command is broken upstream with
      # current webpack / Module Federation transitive versions (fails
      # with "no files found for remoteEntry chunk"). The actual
      # `library share` command on merge has its own working pipeline.
      # A typecheck is the best PR-time gate we have against shipping
      # broken component code.
      - name: Typecheck webflow components
        run: pnpm exec tsc --noEmit -p apps/webflow-components/tsconfig.json

  unit-tests:
    name: Unit Tests & Coverage
    needs: [install]
    runs-on: ubuntu-latest
    if: github.repository == 'Maple-and-Spruce/maple-and-spruce'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Restore node_modules cache
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ needs.install.outputs.cache_key }}

      - name: Run unit tests with coverage
        run: pnpm exec vitest run --coverage

      - name: Upload unit coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage/unit/coverage-final.json
          if-no-files-found: error

  integration-test-matrix:
    name: Plan Integration Tests
    needs: [install]
    runs-on: ubuntu-latest
    if: github.repository == 'Maple-and-Spruce/maple-and-spruce'
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive nx affected SHAs
        uses: nrwl/nx-set-shas@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Restore node_modules cache
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ needs.install.outputs.cache_key }}

      - name: Generate test matrix
        id: matrix
        run: echo "matrix=$(node tools/ci-integration-test-matrix.js --max-per-group 5 --affected)" >> $GITHUB_OUTPUT

  integration-tests:
    name: Integration Tests (${{ matrix.group.index }}/${{ matrix.group.total }})
    needs: [install, integration-test-matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.repository == 'Maple-and-Spruce/maple-and-spruce' && fromJson(needs.integration-test-matrix.outputs.matrix).group[0] != null
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.integration-test-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Restore node_modules cache
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ needs.install.outputs.cache_key }}

      - name: Build functions
        run: |
          pnpm exec nx run functions:build
          pnpm exec nx run functions-square:build
          pnpm exec nx run functions-sync:build
          pnpm exec nx run functions-calendar:build
          pnpm exec nx run functions-webhooks:build
          pnpm exec nx run functions-square-webhook:build

      - name: Create emulator .env
        run: |
          # Copy .env.dev to every codebase (has all shared project-level params)
          # Strip comments and blank lines — Firebase .env parser needs clean key=value pairs
          for dir in dist/apps/functions dist/apps/functions-square dist/apps/functions-sync dist/apps/functions-calendar dist/apps/functions-webhooks dist/apps/functions-square-webhook; do
            grep -v '^#' .env.dev | grep -v '^$' > "$dir/.env"
          done

          # maple-core: Etsy mock server URL + fake secrets
          echo "ETSY_API_BASE=http://localhost:9998/v3/application" >> dist/apps/functions/.env
          # Tally lead webhook → GA4 + Meta CAPI mock servers
          echo "GA4_BASE_URL=http://localhost:9995" >> dist/apps/functions/.env
          echo "META_CAPI_BASE_URL=http://localhost:9994" >> dist/apps/functions/.env
          echo "GA4_MEASUREMENT_ID=G-TEST-MOCK" >> dist/apps/functions/.env
          echo "META_PIXEL_ID=test-pixel-id" >> dist/apps/functions/.env
          # Distinct from META_PIXEL_ID on purpose: registration-conversions.spec
          # asserts MT purchases post to the Music Together pixel, not the
          # Maple & Spruce one. Same value in both would make that test vacuous.
          echo "META_PIXEL_ID_MUSIC_TOGETHER=test-mt-pixel-id" >> dist/apps/functions/.env
          echo "META_CAPI_API_VERSION=v20.0" >> dist/apps/functions/.env
          printf "ETSY_API_KEY=fake\nETSY_SHARED_SECRET=fake\nGA4_API_SECRET=test-ga4-secret\nMETA_CAPI_TOKEN=test-meta-token\n" > dist/apps/functions/.secret.local

          # maple-webhooks: tallyLeadWebhook declares these defineSecret params;
          # without them the emulator silently waits on stdin for each one.
          printf "TALLY_WEBHOOK_SECRET=test-tally-secret\nGA4_API_SECRET=test-ga4-secret\nMETA_CAPI_TOKEN=test-meta-token\n" > dist/apps/functions-webhooks/.secret.local

          # tallyLeadWebhook → GA4 + Meta CAPI mock servers
          echo "GA4_BASE_URL=http://localhost:9995" >> dist/apps/functions-webhooks/.env
          echo "META_CAPI_BASE_URL=http://localhost:9994" >> dist/apps/functions-webhooks/.env
          echo "GA4_MEASUREMENT_ID=G-TEST-MOCK" >> dist/apps/functions-webhooks/.env
          echo "META_PIXEL_ID=test-pixel-id" >> dist/apps/functions-webhooks/.env
          echo "META_PIXEL_ID_MUSIC_TOGETHER=test-mt-pixel-id" >> dist/apps/functions-webhooks/.env
          echo "META_CAPI_API_VERSION=v20.0" >> dist/apps/functions-webhooks/.env

          # maple-square-webhook: squareWebhook declares this defineSecret param.
          printf "SQUARE_WEBHOOK_SIGNATURE_KEY=mock-key\n" > dist/apps/functions-square-webhook/.secret.local

          # maple-square: Square mock server URL + fake secrets
          echo "SQUARE_BASE_URL=http://localhost:9997" >> dist/apps/functions-square/.env
          echo "ETSY_API_BASE=http://localhost:9998/v3/application" >> dist/apps/functions-square/.env
          printf "SQUARE_ACCESS_TOKEN=mock-token\nMT_SQUARE_ACCESS_TOKEN=mock-token\nSQUARE_WEBHOOK_SIGNATURE_KEY=mock-key\nETSY_API_KEY=fake\nETSY_SHARED_SECRET=fake\n" > dist/apps/functions-square/.secret.local

          # maple-sync: Webflow mock server URL + fake secrets
          echo "WEBFLOW_BASE_URL=http://localhost:9996" >> dist/apps/functions-sync/.env
          echo "ETSY_API_BASE=http://localhost:9998/v3/application" >> dist/apps/functions-sync/.env
          echo "ETSY_TOKEN_URL=http://localhost:9998/v3/public/oauth/token" >> dist/apps/functions-sync/.env
          printf "WEBFLOW_API_TOKEN=mock-token\nETSY_API_KEY=fake\nETSY_SHARED_SECRET=fake\n" > dist/apps/functions-sync/.secret.local

      - name: Start mock servers and run integration tests
        run: |
          # Pre-warm npx tsx cache to avoid race condition when three
          # parallel invocations try to download tsx simultaneously
          npx tsx --version

          # Start per-service mock HTTP servers (Square, Webflow, Etsy, GA4, Meta CAPI)
          SQUARE_MOCK_SERVER_PORT=9997 npx tsx libs/firebase/square-test-mock-server/start.ts &
          SQUARE_MOCK_PID=$!
          WEBFLOW_MOCK_SERVER_PORT=9996 npx tsx libs/firebase/webflow-test-mock-server/start.ts &
          WEBFLOW_MOCK_PID=$!
          ETSY_MOCK_SERVER_PORT=9998 npx tsx libs/firebase/etsy-test-mock-server/start.ts &
          ETSY_MOCK_PID=$!
          GA4_MOCK_SERVER_PORT=9995 npx tsx libs/firebase/ga4-test-mock-server/start.ts &
          GA4_MOCK_PID=$!
          META_CAPI_MOCK_SERVER_PORT=9994 npx tsx libs/firebase/meta-capi-test-mock-server/start.ts &
          META_CAPI_MOCK_PID=$!
          sleep 2

          # Run the suites assigned to this matrix group
          npx firebase emulators:exec --project=dev --only auth,firestore,functions \
            "node tools/run-integration-test-suites.js ${{ matrix.group.suites }}"
          EXIT_CODE=$?

          kill $SQUARE_MOCK_PID 2>/dev/null || true
          kill $WEBFLOW_MOCK_PID 2>/dev/null || true
          kill $ETSY_MOCK_PID 2>/dev/null || true
          kill $GA4_MOCK_PID 2>/dev/null || true
          kill $META_CAPI_MOCK_PID 2>/dev/null || true
          exit $EXIT_CODE

  integration-tests-result:
    name: Integration Tests
    needs: [integration-test-matrix, integration-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check matrix result
        run: |
          matrix="${{ needs.integration-test-matrix.result }}"
          tests="${{ needs.integration-tests.result }}"
          echo "integration-test-matrix: $matrix"
          echo "integration-tests: $tests"

          # Fail on actual failures or cancellations — skipped is OK (no affected suites or repo filter)
          if [[ "$matrix" == "failure" || "$matrix" == "cancelled" ]]; then
            echo "::error::Matrix setup failed"
            exit 1
          fi
          # When no integration test suites are affected, the matrix emits {"group": []}
          # which causes zero shard jobs. GitHub reports this as "skipped" — that's fine.
          if [[ "$tests" == "skipped" ]]; then
            echo "No integration test suites affected — skipping"
            exit 0
          fi
          if [[ "$tests" == "failure" || "$tests" == "cancelled" ]]; then
            echo "::error::One or more integration test groups failed"
            exit 1
          fi

  registration-e2e:
    # PR-time FE→BE end-to-end: drives the production RegistrationWidget
    # (mounted in apps/registration-test-harness) against the local
    # Firebase emulator with the PR's own cloud-function code, the real
    # Square sandbox, and HTTP mock servers for Webflow + Etsy (no real
    # sandbox exists for those). Catches bugs neither the Storybook
    # interaction tests nor the cloud-function integration tests can
    # see: the arg-shape contract between the form and the callable,
    # the cost-summary render contract, AND the Square tokenize →
    # createRegistration → success flow against actual Square infra.
    #
    # The same spec set is reused post-merge against deployed dev
    # (see firebase-functions-merge.yml :: e2e_dev) — that's the
    # "real-everything including Webflow/Etsy" gate before prod.
    name: Registration E2E
    needs: [install]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.repository == 'Maple-and-Spruce/maple-and-spruce'
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup Java
        # Required by Firestore emulator (same as integration-tests job).
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Restore node_modules cache
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ needs.install.outputs.cache_key }}

      - name: Install Playwright chromium
        # Mirrors the storybook job — chromium only, with system deps.
        run: pnpm exec playwright install --with-deps chromium

      - name: Build function codebases
        # All four are required: createRegistration lives in maple-square,
        # the Firestore-trigger sync functions live in maple-sync, and
        # firebase.json declares all four source dirs.
        run: |
          pnpm exec nx run functions:build
          pnpm exec nx run functions-square:build
          pnpm exec nx run functions-sync:build
          pnpm exec nx run functions-calendar:build
          pnpm exec nx run functions-webhooks:build
          pnpm exec nx run functions-square-webhook:build

      - name: Create emulator .env
        # Mirrors the integration-tests job, with one critical difference:
        # we DON'T set SQUARE_BASE_URL so the SDK uses its built-in
        # sandbox base URL (connect.squareupsandbox.com) and we feed it
        # the real sandbox access token from repo secrets. Webflow and
        # Etsy still hit local mock servers because there's no usable
        # sandbox for either.
        #
        # ALLOWED_ORIGINS is extended with the harness origin
        # (127.0.0.1:4173) so the function CORS middleware doesn't
        # turn callables into permission-denied.
        env:
          SQUARE_SANDBOX_ACCESS_TOKEN: ${{ secrets.SQUARE_SANDBOX_ACCESS_TOKEN }}
        run: |
          for dir in dist/apps/functions dist/apps/functions-square dist/apps/functions-sync dist/apps/functions-calendar dist/apps/functions-webhooks dist/apps/functions-square-webhook; do
            grep -v '^#' .env.dev | grep -v '^$' > "$dir/.env"
          done

          # maple-core: Etsy mock server URL + fake secrets
          echo "ETSY_API_BASE=http://localhost:9998/v3/application" >> dist/apps/functions/.env
          # maple-core: conversion functions declare these defineSecret params;
          # without them the emulator silently waits on stdin for each one.
          printf "ETSY_API_KEY=fake\nETSY_SHARED_SECRET=fake\nGA4_API_SECRET=test-ga4-secret\nMETA_CAPI_TOKEN=test-meta-token\n" > dist/apps/functions/.secret.local

          # maple-webhooks: tallyLeadWebhook declares these defineSecret params;
          # without them the emulator silently waits on stdin for each one.
          printf "TALLY_WEBHOOK_SECRET=test-tally-secret\nGA4_API_SECRET=test-ga4-secret\nMETA_CAPI_TOKEN=test-meta-token\n" > dist/apps/functions-webhooks/.secret.local

          # maple-square-webhook: squareWebhook declares this defineSecret param.
          printf "SQUARE_WEBHOOK_SIGNATURE_KEY=mock-key\n" > dist/apps/functions-square-webhook/.secret.local
          # maple-square: real Square sandbox (no SQUARE_BASE_URL → SDK
          # uses its built-in sandbox endpoint). Etsy still mocked.
          echo "ETSY_API_BASE=http://localhost:9998/v3/application" >> dist/apps/functions-square/.env
          printf "SQUARE_ACCESS_TOKEN=%s\nSQUARE_WEBHOOK_SIGNATURE_KEY=mock-key\nETSY_API_KEY=fake\nETSY_SHARED_SECRET=fake\n" "$SQUARE_SANDBOX_ACCESS_TOKEN" > dist/apps/functions-square/.secret.local

          # maple-sync: Webflow + Etsy mock servers
          echo "WEBFLOW_BASE_URL=http://localhost:9996" >> dist/apps/functions-sync/.env
          echo "ETSY_API_BASE=http://localhost:9998/v3/application" >> dist/apps/functions-sync/.env
          echo "ETSY_TOKEN_URL=http://localhost:9998/v3/public/oauth/token" >> dist/apps/functions-sync/.env
          printf "WEBFLOW_API_TOKEN=mock-token\nETSY_API_KEY=fake\nETSY_SHARED_SECRET=fake\n" > dist/apps/functions-sync/.secret.local

          for dir in dist/apps/functions dist/apps/functions-square dist/apps/functions-sync dist/apps/functions-calendar dist/apps/functions-webhooks dist/apps/functions-square-webhook; do
            EXISTING=$(grep '^ALLOWED_ORIGINS=' "$dir/.env" | head -1 | cut -d= -f2-)
            echo "ALLOWED_ORIGINS=$EXISTING,http://127.0.0.1:4173,http://localhost:4173" >> "$dir/.env"
          done

      - name: Start mock servers (Webflow + Etsy)
        # Square is intentionally NOT mocked — the spec exercises real
        # tokenization against Square sandbox. Webflow and Etsy don't
        # have a usable sandbox so we keep the in-repo mock servers.
        run: |
          # Pre-warm npx tsx cache (matches integration-tests pattern)
          npx tsx --version

          WEBFLOW_MOCK_SERVER_PORT=9996 npx tsx libs/firebase/webflow-test-mock-server/start.ts &
          echo "WEBFLOW_MOCK_PID=$!" >> $GITHUB_ENV
          ETSY_MOCK_SERVER_PORT=9998 npx tsx libs/firebase/etsy-test-mock-server/start.ts &
          echo "ETSY_MOCK_PID=$!" >> $GITHUB_ENV
          sleep 2

      - name: Run Playwright against emulator
        # firebase emulators:exec handles emulator lifecycle. Playwright's
        # webServer config (in playwright.config.ts) boots the Vite
        # harness on 127.0.0.1:4173 with VITE_SQUARE_APPLICATION_ID /
        # VITE_SQUARE_LOCATION_ID picked up from process.env via
        # vite.config.ts. The IDs are extracted from .env.dev (public —
        # they ship to browsers) so the workflow doesn't fork that
        # source of truth.
        run: |
          export VITE_SQUARE_APPLICATION_ID=$(grep '^SQUARE_APPLICATION_ID=' .env.dev | cut -d= -f2-)
          export VITE_SQUARE_LOCATION_ID=$(grep '^SQUARE_LOCATION_ID=' .env.dev | cut -d= -f2-)

          npx firebase emulators:exec --project=dev --only auth,firestore,functions \
            "pnpm exec nx run registration-e2e:e2e"

      - name: Stop mock servers
        if: always()
        run: |
          kill "$WEBFLOW_MOCK_PID" 2>/dev/null || true
          kill "$ETSY_MOCK_PID" 2>/dev/null || true

      - name: Locate Playwright report paths
        if: failure()
        # The HTML reporter's output path depends on Playwright's resolved
        # cwd, which has been surprising under nx (the path differs from
        # what `cwd: apps/registration-e2e` in project.json suggests).
        # Find both report + raw test-results wherever they ended up.
        run: |
          find . -type d \( -name 'playwright-report' -o -name 'test-results' \) \
            -not -path '*/node_modules/*' -not -path '*/.next/*' \
            -print

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-registration-e2e
          # Tar everything under either dir name anywhere in the tree so
          # we don't lose traces/screenshots to a path mismatch again.
          path: |
            **/playwright-report/**
            **/test-results/**
          if-no-files-found: ignore
          retention-days: 7

  pos-sandbox-e2e:
    # Tier-1 real-Square-sandbox POS coverage. The Cloud Functions run in the
    # Firebase emulator, but the maple-square codebase's .env DELIBERATELY omits
    # SQUARE_BASE_URL — so the Square SDK inside those functions hits the REAL
    # sandbox (connect.squareupsandbox.com) with the sandbox access token. The
    # vitest suite drives the same sandbox directly to stand up real orders /
    # payments / catalog items, and self-signs inbound webhooks with the known
    # `mock-key`. This closes the mock-drift gap the mock-backed
    # functions-integration-tests-class-square suite can't see: it proves the
    # POS inbound paths (syncClassToSquare → order+payment → payment.updated →
    # processPosSale; inventory.count.updated → product cache) against ACTUAL
    # Square responses.
    #
    # Named pos-sandbox-e2e (NOT functions-integration-tests-*) so the standard
    # integration-test matrix — which points SQUARE_BASE_URL at the mock — never
    # picks it up; only this dedicated real-sandbox job runs it. Same reason
    # registration-e2e is named that way.
    name: POS Sandbox E2E
    needs: [install]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.repository == 'Maple-and-Spruce/maple-and-spruce'
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup Java
        # Required by Firestore emulator (same as integration-tests job).
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Restore node_modules cache
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ needs.install.outputs.cache_key }}

      - name: Build function codebases
        # All four are required: squareWebhook + processPosSale + syncClassToSquare
        # live in maple-square, and the class write also fires syncClassToWebflow
        # in maple-sync (which must reach a Webflow mock, not real Webflow).
        # firebase.json declares all four source dirs, so the emulator loads them all.
        run: |
          pnpm exec nx run functions:build
          pnpm exec nx run functions-square:build
          pnpm exec nx run functions-sync:build
          pnpm exec nx run functions-calendar:build
          pnpm exec nx run functions-webhooks:build
          pnpm exec nx run functions-square-webhook:build

      - name: Create emulator .env
        # Copied VERBATIM from the registration-e2e job: we DON'T set
        # SQUARE_BASE_URL so the SDK uses its built-in sandbox base URL
        # (connect.squareupsandbox.com) and we feed it the real sandbox access
        # token. Webflow and Etsy still hit local mock servers because there's
        # no usable sandbox for either — the class-write trigger's
        # syncClassToWebflow call goes to the Webflow mock instead of hanging.
        env:
          SQUARE_SANDBOX_ACCESS_TOKEN: ${{ secrets.SQUARE_SANDBOX_ACCESS_TOKEN }}
        run: |
          for dir in dist/apps/functions dist/apps/functions-square dist/apps/functions-sync dist/apps/functions-calendar dist/apps/functions-webhooks dist/apps/functions-square-webhook; do
            grep -v '^#' .env.dev | grep -v '^$' > "$dir/.env"
          done

          # maple-core: Etsy mock server URL + fake secrets
          echo "ETSY_API_BASE=http://localhost:9998/v3/application" >> dist/apps/functions/.env
          # maple-core: conversion functions declare these defineSecret params;
          # without them the emulator silently waits on stdin for each one.
          printf "ETSY_API_KEY=fake\nETSY_SHARED_SECRET=fake\nGA4_API_SECRET=test-ga4-secret\nMETA_CAPI_TOKEN=test-meta-token\n" > dist/apps/functions/.secret.local

          # maple-webhooks: tallyLeadWebhook declares these defineSecret params;
          # without them the emulator silently waits on stdin for each one.
          printf "TALLY_WEBHOOK_SECRET=test-tally-secret\nGA4_API_SECRET=test-ga4-secret\nMETA_CAPI_TOKEN=test-meta-token\n" > dist/apps/functions-webhooks/.secret.local

          # maple-square-webhook: squareWebhook declares this defineSecret param.
          printf "SQUARE_WEBHOOK_SIGNATURE_KEY=mock-key\n" > dist/apps/functions-square-webhook/.secret.local
          # maple-square: real Square sandbox (no SQUARE_BASE_URL → SDK
          # uses its built-in sandbox endpoint). Etsy still mocked.
          echo "ETSY_API_BASE=http://localhost:9998/v3/application" >> dist/apps/functions-square/.env
          printf "SQUARE_ACCESS_TOKEN=%s\nSQUARE_WEBHOOK_SIGNATURE_KEY=mock-key\nETSY_API_KEY=fake\nETSY_SHARED_SECRET=fake\n" "$SQUARE_SANDBOX_ACCESS_TOKEN" > dist/apps/functions-square/.secret.local

          # maple-sync: Webflow + Etsy mock servers
          echo "WEBFLOW_BASE_URL=http://localhost:9996" >> dist/apps/functions-sync/.env
          echo "ETSY_API_BASE=http://localhost:9998/v3/application" >> dist/apps/functions-sync/.env
          echo "ETSY_TOKEN_URL=http://localhost:9998/v3/public/oauth/token" >> dist/apps/functions-sync/.env
          printf "WEBFLOW_API_TOKEN=mock-token\nETSY_API_KEY=fake\nETSY_SHARED_SECRET=fake\n" > dist/apps/functions-sync/.secret.local

      - name: Start mock servers (Webflow + Etsy)
        # Square is intentionally NOT mocked — the suite exercises the real
        # sandbox. Webflow and Etsy have no usable sandbox, so the in-repo mock
        # servers absorb the class-write sync triggers.
        run: |
          # Pre-warm npx tsx cache (matches integration-tests pattern)
          npx tsx --version

          WEBFLOW_MOCK_SERVER_PORT=9996 npx tsx libs/firebase/webflow-test-mock-server/start.ts &
          echo "WEBFLOW_MOCK_PID=$!" >> $GITHUB_ENV
          ETSY_MOCK_SERVER_PORT=9998 npx tsx libs/firebase/etsy-test-mock-server/start.ts &
          echo "ETSY_MOCK_PID=$!" >> $GITHUB_ENV
          sleep 2

      - name: Run POS sandbox e2e against emulator
        # firebase emulators:exec manages emulator lifecycle. The TEST process
        # (vitest) needs the same Square sandbox credentials the functions read,
        # so it can create real orders/payments/catalog items directly:
        #   SQUARE_ACCESS_TOKEN  the real sandbox token (repo secret)
        #   SQUARE_LOCATION_ID   sandbox location id (public, from .env.dev)
        #   SQUARE_ENV=LOCAL     → SDK sandbox environment
        #   SALES_TAX_RATE       sales-tax percent (public, from .env.dev)
        # SQUARE_BASE_URL is intentionally NOT exported, so the test client also
        # hits the real sandbox.
        env:
          SQUARE_ACCESS_TOKEN: ${{ secrets.SQUARE_SANDBOX_ACCESS_TOKEN }}
          SQUARE_ENV: LOCAL
        run: |
          export SQUARE_LOCATION_ID=$(grep '^SQUARE_LOCATION_ID=' .env.dev | cut -d= -f2-)
          export SALES_TAX_RATE=$(grep '^SALES_TAX_RATE=' .env.dev | cut -d= -f2-)

          npx firebase emulators:exec --project=dev --only auth,firestore,functions \
            "pnpm exec vitest run --config apps/pos-sandbox-e2e/vitest.config.ts --reporter=verbose"

      - name: Stop mock servers
        if: always()
        run: |
          kill "$WEBFLOW_MOCK_PID" 2>/dev/null || true
          kill "$ETSY_MOCK_PID" 2>/dev/null || true

  music-together-e2e:
    # PR-time FE→BE end-to-end for Music Together enrollment — the higher-layer
    # counterpart to the MT cloud-function integration suite. Drives the
    # production MusicTogetherRegistrationWidget (mounted in the shared
    # registration-test-harness via ?mtSectionId=) against the local Firebase
    # emulator with the PR's own code, MT's REAL Square sandbox account, and
    # HTTP mock servers for Webflow + Etsy.
    #
    # Money must route to MT's SEPARATE Square account (MT_SQUARE_KEYS), not
    # Maple & Spruce's — the spec reads each payment back from MT's sandbox and
    # asserts its location_id. This requires MT's sandbox access token, which
    # M&S's SQUARE_SANDBOX_ACCESS_TOKEN is NOT (different Square account/app).
    #
    # Activation: set the repo secret MT_SQUARE_SANDBOX_ACCESS_TOKEN to MT's
    # sandbox access token (same value as MT_SQUARE_ACCESS_TOKEN in the
    # maple-and-spruce-dev Secret Manager). Until it's set, this job no-ops
    # (steps are gated on the secret) so it stays green; the post-merge
    # mt_e2e_dev gate already exercises the real flow against deployed dev.
    name: Music Together E2E
    needs: [install]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.repository == 'Maple-and-Spruce/maple-and-spruce'
    env:
      MT_SQUARE_SANDBOX_ACCESS_TOKEN: ${{ secrets.MT_SQUARE_SANDBOX_ACCESS_TOKEN }}
    steps:
      - name: Check MT sandbox secret
        id: gate
        run: |
          if [ -n "$MT_SQUARE_SANDBOX_ACCESS_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Music Together E2E skipped::Set the repo secret MT_SQUARE_SANDBOX_ACCESS_TOKEN (MT's sandbox access token) to activate this gate. The post-merge mt_e2e_dev job still exercises the real flow."
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.enabled == 'true'

      - name: Setup pnpm
        if: steps.gate.outputs.enabled == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup Java
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Restore node_modules cache
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ needs.install.outputs.cache_key }}

      - name: Install Playwright chromium
        if: steps.gate.outputs.enabled == 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Build function codebases
        if: steps.gate.outputs.enabled == 'true'
        run: |
          pnpm exec nx run functions:build
          pnpm exec nx run functions-square:build
          pnpm exec nx run functions-sync:build
          pnpm exec nx run functions-calendar:build
          pnpm exec nx run functions-webhooks:build
          pnpm exec nx run functions-square-webhook:build

      - name: Create emulator .env
        # Mirrors the Registration E2E job. No SQUARE_BASE_URL, so the Square
        # SDK uses its built-in sandbox endpoint. The DEFAULT (M&S) Square
        # client is never invoked by the MT flow, so its token can be a
        # placeholder; MT_SQUARE_ACCESS_TOKEN gets the REAL MT sandbox token.
        if: steps.gate.outputs.enabled == 'true'
        run: |
          for dir in dist/apps/functions dist/apps/functions-square dist/apps/functions-sync dist/apps/functions-calendar dist/apps/functions-webhooks dist/apps/functions-square-webhook; do
            grep -v '^#' .env.dev | grep -v '^$' > "$dir/.env"
          done

          echo "ETSY_API_BASE=http://localhost:9998/v3/application" >> dist/apps/functions/.env
          printf "ETSY_API_KEY=fake\nETSY_SHARED_SECRET=fake\nGA4_API_SECRET=test-ga4-secret\nMETA_CAPI_TOKEN=test-meta-token\n" > dist/apps/functions/.secret.local

          # maple-webhooks: tallyLeadWebhook declares these defineSecret params;
          # without them the emulator silently waits on stdin for each one.
          printf "TALLY_WEBHOOK_SECRET=test-tally-secret\nGA4_API_SECRET=test-ga4-secret\nMETA_CAPI_TOKEN=test-meta-token\n" > dist/apps/functions-webhooks/.secret.local

          # maple-square-webhook: squareWebhook declares this defineSecret param.
          printf "SQUARE_WEBHOOK_SIGNATURE_KEY=mock-key\n" > dist/apps/functions-square-webhook/.secret.local
          echo "ETSY_API_BASE=http://localhost:9998/v3/application" >> dist/apps/functions-square/.env
          printf "SQUARE_ACCESS_TOKEN=unused-mock-token\nMT_SQUARE_ACCESS_TOKEN=%s\nSQUARE_WEBHOOK_SIGNATURE_KEY=mock-key\nETSY_API_KEY=fake\nETSY_SHARED_SECRET=fake\n" "$MT_SQUARE_SANDBOX_ACCESS_TOKEN" > dist/apps/functions-square/.secret.local

          echo "WEBFLOW_BASE_URL=http://localhost:9996" >> dist/apps/functions-sync/.env
          echo "ETSY_API_BASE=http://localhost:9998/v3/application" >> dist/apps/functions-sync/.env
          echo "ETSY_TOKEN_URL=http://localhost:9998/v3/public/oauth/token" >> dist/apps/functions-sync/.env
          printf "WEBFLOW_API_TOKEN=mock-token\nETSY_API_KEY=fake\nETSY_SHARED_SECRET=fake\n" > dist/apps/functions-sync/.secret.local

          for dir in dist/apps/functions dist/apps/functions-square dist/apps/functions-sync dist/apps/functions-calendar dist/apps/functions-webhooks dist/apps/functions-square-webhook; do
            EXISTING=$(grep '^ALLOWED_ORIGINS=' "$dir/.env" | head -1 | cut -d= -f2-)
            echo "ALLOWED_ORIGINS=$EXISTING,http://127.0.0.1:4173,http://localhost:4173" >> "$dir/.env"
          done

      - name: Start mock servers (Webflow + Etsy)
        # Square is intentionally NOT mocked — the spec charges MT's real Square
        # sandbox. Webflow + Etsy have no usable sandbox so keep the mocks.
        if: steps.gate.outputs.enabled == 'true'
        run: |
          npx tsx --version
          WEBFLOW_MOCK_SERVER_PORT=9996 npx tsx libs/firebase/webflow-test-mock-server/start.ts &
          echo "WEBFLOW_MOCK_PID=$!" >> $GITHUB_ENV
          ETSY_MOCK_SERVER_PORT=9998 npx tsx libs/firebase/etsy-test-mock-server/start.ts &
          echo "ETSY_MOCK_PID=$!" >> $GITHUB_ENV
          sleep 2

      - name: Run Playwright against emulator
        # The harness Vite build gets MT's public Square app/location IDs from
        # .env.dev; the spec gets MT's token + location + env so it can read the
        # payment back from MT's sandbox and assert correct account routing.
        if: steps.gate.outputs.enabled == 'true'
        env:
          MT_SQUARE_ACCESS_TOKEN: ${{ secrets.MT_SQUARE_SANDBOX_ACCESS_TOKEN }}
        run: |
          export VITE_MT_SQUARE_APPLICATION_ID=$(grep '^MT_SQUARE_APPLICATION_ID=' .env.dev | cut -d= -f2-)
          export VITE_MT_SQUARE_LOCATION_ID=$(grep '^MT_SQUARE_LOCATION_ID=' .env.dev | cut -d= -f2-)
          export MT_SQUARE_LOCATION_ID=$(grep '^MT_SQUARE_LOCATION_ID=' .env.dev | cut -d= -f2-)
          export MT_SQUARE_ENV=$(grep '^MT_SQUARE_ENV=' .env.dev | cut -d= -f2-)

          npx firebase emulators:exec --project=dev --only auth,firestore,functions \
            "pnpm exec nx run music-together-e2e:e2e"

      - name: Stop mock servers
        if: always() && steps.gate.outputs.enabled == 'true'
        run: |
          kill "$WEBFLOW_MOCK_PID" 2>/dev/null || true
          kill "$ETSY_MOCK_PID" 2>/dev/null || true

      - name: Locate Playwright report paths
        if: failure() && steps.gate.outputs.enabled == 'true'
        run: |
          find . -type d \( -name 'playwright-report' -o -name 'test-results' \) \
            -not -path '*/node_modules/*' -not -path '*/.next/*' \
            -print

      - name: Upload Playwright artifacts on failure
        if: failure() && steps.gate.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-music-together-e2e
          path: |
            **/playwright-report/**
            **/test-results/**
          if-no-files-found: ignore
          retention-days: 7

  portal-e2e:
    # Admin-portal role-scoping E2E — the first browser-level proof that the
    # scoped-roles wiring (RolesProvider → getMyRoles → RoleGuard + nav
    # filtering, epic #617) holds in the assembled Next.js app. Drives the real
    # app against local emulators (auth + firestore + functions with the PR's
    # own code): sign in through the login form, assert the role-filtered shell.
    # No external services — always runs (no secret gate).
    name: Portal E2E
    needs: [install]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.repository == 'Maple-and-Spruce/maple-and-spruce'
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Restore node_modules cache
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ needs.install.outputs.cache_key }}

      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build function codebases
        run: |
          pnpm exec nx run functions:build
          pnpm exec nx run functions-square:build
          pnpm exec nx run functions-sync:build
          pnpm exec nx run functions-calendar:build
          pnpm exec nx run functions-webhooks:build
          pnpm exec nx run functions-square-webhook:build

      - name: Create emulator .env
        run: |
          for dir in dist/apps/functions dist/apps/functions-square dist/apps/functions-sync dist/apps/functions-calendar dist/apps/functions-webhooks dist/apps/functions-square-webhook; do
            grep -v '^#' .env.dev | grep -v '^$' > "$dir/.env"
          done

          # Mock secrets so the emulator doesn't stall on missing defineSecret params.
          printf "ETSY_API_KEY=fake\nETSY_SHARED_SECRET=fake\nGA4_API_SECRET=test\nMETA_CAPI_TOKEN=test\n" > dist/apps/functions/.secret.local

          # maple-webhooks: tallyLeadWebhook declares these defineSecret params;
          # without them the emulator silently waits on stdin for each one.
          printf "TALLY_WEBHOOK_SECRET=test\nGA4_API_SECRET=test\nMETA_CAPI_TOKEN=test\n" > dist/apps/functions-webhooks/.secret.local

          # maple-square-webhook: squareWebhook declares this defineSecret param.
          printf "SQUARE_WEBHOOK_SIGNATURE_KEY=mock-key\n" > dist/apps/functions-square-webhook/.secret.local
          printf "SQUARE_ACCESS_TOKEN=mock-token\nMT_SQUARE_ACCESS_TOKEN=mock-token\nSQUARE_WEBHOOK_SIGNATURE_KEY=mock-key\nETSY_API_KEY=fake\nETSY_SHARED_SECRET=fake\n" > dist/apps/functions-square/.secret.local
          printf "WEBFLOW_API_TOKEN=mock-token\nETSY_API_KEY=fake\nETSY_SHARED_SECRET=fake\n" > dist/apps/functions-sync/.secret.local

          # External integrations → closed port (portal login/nav flow needs none).
          echo "SQUARE_BASE_URL=http://127.0.0.1:1" >> dist/apps/functions-square/.env
          echo "WEBFLOW_BASE_URL=http://127.0.0.1:1" >> dist/apps/functions-sync/.env
          echo "ETSY_API_BASE=http://127.0.0.1:1" >> dist/apps/functions-sync/.env

          # CORS: the app's callables come from the Next dev origin (localhost:3000).
          for dir in dist/apps/functions dist/apps/functions-square dist/apps/functions-sync dist/apps/functions-calendar dist/apps/functions-webhooks dist/apps/functions-square-webhook; do
            EXISTING=$(grep '^ALLOWED_ORIGINS=' "$dir/.env" | head -1 | cut -d= -f2-)
            echo "ALLOWED_ORIGINS=$EXISTING,http://localhost:3000,http://127.0.0.1:3000" >> "$dir/.env"
          done

          # The Next app reads emulator ports from .env.local (the reliable
          # channel to the browser bundle). CI runs at offset 0 → default ports.
          printf "NEXT_PUBLIC_FUNCTIONS_EMULATOR_PORT=5001\nNEXT_PUBLIC_AUTH_EMULATOR_PORT=9099\n" > apps/maple-spruce/.env.local

      - name: Run Playwright against emulator
        run: |
          npx firebase emulators:exec \
            --project=dev \
            --only auth,firestore,functions \
            "pnpm exec nx run maple-spruce-e2e:e2e"

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-portal-e2e
          path: |
            **/playwright-report/**
            **/test-results/**
          if-no-files-found: ignore
          retention-days: 7

  storybook:
    name: Storybook Build & Tests
