name: Deploy on merge

# Pipeline ("known-good dev" + manual prod approval):
#
#   merge to main
#     ├── prepare_and_build  (compute affected, build artifacts)
#     ├── deploy_functions_dev   (deploy affected functions → maple-and-spruce-dev)
#     ├── deploy_harness_dev     (build + deploy harness → maple-spruce-registration-test)
#     ├── deploy_vercel_dev      (build + deploy admin app → dev Vercel project / business-dev)
#     ├── e2e_dev                (Playwright → deployed dev URL)
#     │     │
#     │     └── approve_prod  ← MANUAL APPROVAL via `production` Environment
#     │            │                (gated on deploy_vercel_dev AND e2e_dev success;
#     │            │                 a web-app-only merge skips e2e_dev, which is
#     │            │                 treated as a pass so the portal still promotes)
#     │            ├── deploy_functions_prod        (only if approve_prod passed)
#     │            ├── publish_webflow_components   (only if approve_prod passed)
#     │            └── deploy_vercel_prod           (only if approve_prod passed)
#     │
#     ├── deploy_firestore_indexes_dev   (independent — declared indexes → maple-and-spruce-dev)
#     └── deploy_firestore_indexes (prod) (independent — index changes don't block on E2E
#                                          because they take minutes to build and are
#                                          additive; analyzer enforces declaration at PR)
#
# Setup: a "production" GitHub Environment must exist in repo Settings →
# Environments, with at least one required reviewer. Without it, approve_prod
# auto-passes (any user counts as approver) — defeating the purpose.
#
# Per-feature-branch dev deploys are gone — the old
# firebase-functions-dev.yml has been deleted. Dev is the post-merge
# CI environment, not a per-branch playground.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_all:
        description: 'Deploy all functions and publish webflow components (ignore affected check)'
        required: false
        default: 'false'
        type: boolean

env:
  NX_DAEMON: 'false'

# Serialize merge-pipeline runs. Two back-to-back merges otherwise race
# on the shared dev project (B's dev deploy overwrites A's mid-E2E),
# producing flaky failures whose root cause is invisible from the job
# logs. `cancel-in-progress: false` lets the in-flight run finish — we
# never want to cancel a deploy halfway.
concurrency:
  group: deploy-on-merge
  cancel-in-progress: false

jobs:
  prepare_and_build:
    runs-on: ubuntu-latest
    if: github.repository == 'Maple-and-Spruce/maple-and-spruce'
    outputs:
      matrix: ${{ steps.get_affected.outputs.matrix }}
      has_changes: ${{ steps.get_affected.outputs.has_changes }}
      cache_key: ${{ steps.set_cache_key.outputs.key }}
      affected_codebases: ${{ steps.get_affected.outputs.affected_codebases }}
      webflow_components_affected: ${{ steps.get_affected.outputs.webflow_components_affected }}
      web_app_affected: ${{ steps.get_affected.outputs.web_app_affected }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get base commit
        id: base
        run: echo "commit=$(git rev-parse HEAD~1)" >> $GITHUB_OUTPUT

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Generate cache key
        id: set_cache_key
        run: echo "key=${{ runner.os }}-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get affected projects
        id: get_affected
        run: |
          DEPLOY_ALL="${{ github.event.inputs.deploy_all }}"

          # Read the codebase mapping
          MAPPING=$(cat function-codebases.json)
          DEFAULT_CODEBASE=$(echo "$MAPPING" | jq -r '.defaultCodebase')

          # Compute affected projects once — shared by both the functions
          # deploy and the webflow components publish below.
          if [ "$DEPLOY_ALL" != "true" ]; then
            ALL_AFFECTED=$(pnpm exec nx show projects --affected --base=${{ steps.base.outputs.commit }} 2>/dev/null)
            echo "Affected projects:"
            echo "$ALL_AFFECTED"
          fi

          # --- webflow-components (code components library) ---
          # Nx's project graph follows imports, so changes in e.g.
          # libs/react/registrations transitively mark webflow-components
          # as affected. `nx show projects --affected` prints one project
          # per line (NOT a JSON array — an earlier comment here had this
          # wrong, which silently skipped the publish on every merge that
          # only touched webflow-components). Use grep -qx for a full-line
          # match so substrings like "webflow-components-storybook" can't
          # false-positive.
          WEBFLOW_AFFECTED=false
          if [ "$DEPLOY_ALL" == "true" ]; then
            WEBFLOW_AFFECTED=true
          elif echo "$ALL_AFFECTED" | grep -qx 'webflow-components'; then
            WEBFLOW_AFFECTED=true
          fi
          if [ "$WEBFLOW_AFFECTED" == "true" ]; then
            echo "webflow-components is affected — will publish"
          fi
          echo "webflow_components_affected=$WEBFLOW_AFFECTED" >> $GITHUB_OUTPUT

          # --- admin web app (maple-spruce) ---
          # The registration E2E suite (e2e_dev) only runs when functions or
          # webflow-components are affected, so a web-app-only merge skips
          # e2e_dev and — without this flag — never reaches the prod gate
          # (approve_prod), silently stranding portal changes at the last
          # function-touching deploy. Detect the web app the same way as
          # webflow-components: a full-line match (so "maple-spruce-e2e" can't
          # false-positive), with nx's graph marking it affected transitively
          # when an imported lib changes.
          WEB_APP_AFFECTED=false
          if [ "$DEPLOY_ALL" == "true" ]; then
            WEB_APP_AFFECTED=true
          elif echo "$ALL_AFFECTED" | grep -qx 'maple-spruce'; then
            WEB_APP_AFFECTED=true
          fi
          if [ "$WEB_APP_AFFECTED" == "true" ]; then
            echo "maple-spruce (admin web app) is affected — will deploy to prod Vercel after approval"
          fi
          echo "web_app_affected=$WEB_APP_AFFECTED" >> $GITHUB_OUTPUT

          # --- firebase functions ---
          if [ "$DEPLOY_ALL" == "true" ]; then
            echo "Manual deploy_all requested - deploying all functions"
            AFFECTED_LIBS=$(pnpm exec nx show projects | grep 'firebase-maple-functions-' || true)
          else
            # Check if any functions app is affected (e.g., env file changes)
            FUNCTIONS_APP_AFFECTED=$(echo "$ALL_AFFECTED" | grep -E '^functions(-calendar|-square|-sync)?$' || true)

            # Get affected function libraries
            AFFECTED_LIBS=$(echo "$ALL_AFFECTED" | grep 'firebase-maple-functions-' || true)

            # If a functions app is affected but no specific libraries, deploy all functions
            if [ -n "$FUNCTIONS_APP_AFFECTED" ] && [ -z "$AFFECTED_LIBS" ]; then
              echo "Functions app affected (likely env change) - deploying all functions"
              AFFECTED_LIBS=$(pnpm exec nx show projects | grep 'firebase-maple-functions-' || true)
            fi
          fi

          # Build arrays of function names with their codebases
          declare -A CODEBASE_FUNCTIONS
          AFFECTED_CODEBASES_SET=()

          while IFS= read -r lib; do
            # Skip empty lines
            [ -z "$lib" ] && continue

            # Look up codebase from mapping
            CODEBASE=$(echo "$MAPPING" | jq -r --arg lib "$lib" '.functionToCodebase[$lib] // .defaultCodebase')

            # Extract function name from library name (e.g., firebase-maple-functions-get-artists -> getArtists)
            FUNC_NAME=${lib#firebase-maple-functions-}
            # Convert kebab-case to camelCase
            FUNC_NAME=$(echo "$FUNC_NAME" | awk -F'-' '{for(i=1;i<=NF;i++){if(i==1){printf("%s",$i)}else{printf("%s%s",toupper(substr($i,1,1)),substr($i,2))}}}')

            # Append to codebase group
            if [ -z "${CODEBASE_FUNCTIONS[$CODEBASE]}" ]; then
              CODEBASE_FUNCTIONS[$CODEBASE]="functions:${CODEBASE}:${FUNC_NAME}"
              AFFECTED_CODEBASES_SET+=("$CODEBASE")
            else
              CODEBASE_FUNCTIONS[$CODEBASE]="${CODEBASE_FUNCTIONS[$CODEBASE]},functions:${CODEBASE}:${FUNC_NAME}"
            fi
          done <<< "$AFFECTED_LIBS"

          if [ ${#CODEBASE_FUNCTIONS[@]} -eq 0 ]; then
            echo "No functions were affected"
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "matrix={\"include\":[]}" >> $GITHUB_OUTPUT
            echo "affected_codebases=[]" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "has_changes=true" >> $GITHUB_OUTPUT

          # Output affected codebases for the build step
          CODEBASES_JSON=$(printf '%s\n' "${AFFECTED_CODEBASES_SET[@]}" | sort -u | jq -R . | jq -sc .)
          echo "affected_codebases=$CODEBASES_JSON" >> $GITHUB_OUTPUT

          # One matrix entry per codebase. Firebase deploys functions
          # within a codebase serially regardless of how we batch them
          # (a single `firebase deploy` command iterates through them),
          # DIFFERENT codebases were once assumed safe to deploy in parallel —
          # they are NOT: four firebase processes hitting the same project at
          # once saturate Cloud Functions' per-project operation queue and trip
          # 409 "unable to queue the operation" races that silently drop
          # functions. The deploy jobs now serialize codebases (max-parallel:1)
          # with a 409-aware retry, so one entry per codebase is just a clean
          # whole unit of work (no intra-codebase batching).
          GROUP_SIZE=10000
          VALID_GROUPS=()

          for CODEBASE in "${!CODEBASE_FUNCTIONS[@]}"; do
            IFS=',' read -ra FUNCS <<< "${CODEBASE_FUNCTIONS[$CODEBASE]}"
            TOTAL=${#FUNCS[@]}

            for ((i=0; i<TOTAL; i+=GROUP_SIZE)); do
              GROUP_FUNCTIONS=""
              for ((j=i; j<i+GROUP_SIZE && j<TOTAL; j++)); do
                if [ ! -z "$GROUP_FUNCTIONS" ]; then
                  GROUP_FUNCTIONS+=","
                fi
                GROUP_FUNCTIONS+="${FUNCS[j]}"
              done

              if [ ! -z "$GROUP_FUNCTIONS" ]; then
                VALID_GROUPS+=("{\"functions\":\"$GROUP_FUNCTIONS\"}")
              fi
            done
          done

          # Combine valid groups into JSON array with include
          GROUPS_JSON="{\"include\":["
          for ((i=0; i<${#VALID_GROUPS[@]}; i++)); do
            if [ $i -gt 0 ]; then
              GROUPS_JSON+=","
            fi
            GROUPS_JSON+="${VALID_GROUPS[i]}"
          done
          GROUPS_JSON+="]}"

          echo "matrix=$GROUPS_JSON" >> $GITHUB_OUTPUT

          echo "Affected codebases: ${AFFECTED_CODEBASES_SET[*]}"
          echo "Matrix: $GROUPS_JSON"

      - name: Build affected codebases
        if: steps.get_affected.outputs.has_changes == 'true'
        run: |
          MAPPING=$(cat function-codebases.json)
          CODEBASES='${{ steps.get_affected.outputs.affected_codebases }}'

          for CODEBASE in $(echo "$CODEBASES" | jq -r '.[]'); do
            PROJECT=$(echo "$MAPPING" | jq -r --arg cb "$CODEBASE" '.codebaseProjects[$cb]')
            echo "Building codebase: $CODEBASE (project: $PROJECT)"
            pnpm exec nx run ${PROJECT}:build
          done

      - name: Remove generated lockfiles
        if: steps.get_affected.outputs.has_changes == 'true'
        run: |
          # Nx generatePackageJson creates subset lockfiles that miss aliased
          # transitive deps (e.g. square-legacy). Removing them lets Firebase
          # Cloud Build do a fresh pnpm install with proper resolution.
          find dist/apps -name 'pnpm-lock.yaml' -delete

      # Note: env file is no longer copied here. Each deploy job (dev/prod)
      # owns its own env copy so the same artifact can be deployed to
      # multiple projects.

      - name: Cache node_modules for deploy
        if: >-
          steps.get_affected.outputs.has_changes == 'true' ||
          steps.get_affected.outputs.webflow_components_affected == 'true'
        uses: actions/cache/save@v4
        with:
          path: node_modules
          key: ${{ steps.set_cache_key.outputs.key }}

      - name: Upload build artifacts
        if: steps.get_affected.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dist-functions
          path: |
            dist/apps/functions/
            dist/apps/functions-calendar/
            dist/apps/functions-square/
            dist/apps/functions-sync/
          include-hidden-files: true
          retention-days: 1

  deploy_functions_dev:
    needs: prepare_and_build
    if: >-
      needs.prepare_and_build.outputs.has_changes == 'true' &&
      needs.prepare_and_build.outputs.matrix != '' &&
      toJson(fromJson(needs.prepare_and_build.outputs.matrix).include) != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      # Deploy ONE codebase at a time. The matrix is one entry per Firebase
      # codebase; running them concurrently makes all four firebase processes
      # submit Cloud Functions operations to the same project at once,
      # saturating the per-project operation queue and triggering 409
      # "unable to queue the operation" races that SILENTLY drop functions
      # (firebase deploy still exits 0). Serializing — plus the 409-aware
      # retry in the deploy step below — makes a full deploy reliable. Normal
      # merges touch only 1–2 codebases, so the cost lands on rare full deploys.
      max-parallel: 1
      # One codebase failing shouldn't cancel the others mid-deploy.
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare_and_build.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Authenticate to Google Cloud (Dev)
        id: auth
        # functions deploy goes through the Firebase Admin SDK, which can't use
        # the keyless external_account credential file (firebase-admin-node#2168).
        # So mint a short-lived OAuth access token (still keyless, via WIF) and
        # pass it to `firebase deploy --token` below instead.
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/1062803455357/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-deployer@maple-and-spruce-dev.iam.gserviceaccount.com'
          token_format: 'access_token'

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-functions
          path: dist/apps

      - name: Restore node_modules cache
        id: restore-cache
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ needs.prepare_and_build.outputs.cache_key }}

      - name: Install dependencies (fallback)
        if: steps.restore-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Copy .env.dev into dist
        run: |
          MAPPING=$(cat function-codebases.json)
          CODEBASES='${{ needs.prepare_and_build.outputs.affected_codebases }}'
          for CODEBASE in $(echo "$CODEBASES" | jq -r '.[]'); do
            PROJECT=$(echo "$MAPPING" | jq -r --arg cb "$CODEBASE" '.codebaseProjects[$cb]')
            cp .env.dev dist/apps/${PROJECT}/.env
          done

      - name: Deploy functions group to Dev
        if: matrix.functions != ''
        # Retry up to 3 times. The upload step regularly hits transient
        # GCS 5xx (storage.googleapis.com → /gcf-v2-uploads/…). A single
        # 503 used to fail-fast the whole matrix and force a manual
        # re-run-failed-jobs — three attempts with a 30s gap absorbs
        # the noise we've seen in practice.
        run: |
          set -o pipefail
          # Two failure modes to absorb:
          #   1. Transient GCS 5xx during upload → non-zero exit.
          #   2. 409 "unable to queue the operation" races: firebase deploy
          #      exits 0 but SILENTLY drops the contended functions. So we also
          #      scan for that exact marker and retry until a clean run — on
          #      retry the contended operations have cleared and the dropped
          #      functions deploy. We deliberately do NOT match "already exists"
          #      / "failed to create": those are benign (the function IS
          #      deployed; firebase just mis-tracked create vs update) and would
          #      make the retry loop never converge. Genuine create/build
          #      failures exit non-zero and are caught above.
          for attempt in 1 2 3 4; do
            # Keyless WIF access token (minted by the auth step) — the Admin SDK
            # can't consume the external_account credential file, but it accepts
            # a plain bearer token via --token.
            pnpm exec firebase deploy \
              --only ${{ matrix.functions }} \
              --project maple-and-spruce-dev \
              --force \
              --token "${{ steps.auth.outputs.access_token }}" 2>&1 | tee /tmp/fb-deploy.log
            status=${PIPESTATUS[0]}
            if [ "$status" -eq 0 ] && ! grep -qiE 'unable to queue the operation' /tmp/fb-deploy.log; then
              exit 0
            fi
            if [ $attempt -lt 4 ]; then
              echo "::warning::firebase deploy attempt $attempt incomplete (exit=$status or 409 contention); retrying in 30s"
              sleep 30
            fi
          done
          echo "::error::firebase deploy failed or left functions undeployed after 4 attempts"
          exit 1

      - name: Skip empty function group
        if: matrix.functions == ''
        run: echo "Skipping deployment for empty function group"

  deploy_harness_dev:
    # Build + deploy the registration test harness to Firebase Hosting on
    # the dev project so the E2E suite can hit a stable public URL. Runs
    # whenever functions or webflow-components changed — anything that
    # could affect what the widget calls or how it renders.
    needs: prepare_and_build
    if: >-
      needs.prepare_and_build.outputs.has_changes == 'true' ||
      needs.prepare_and_build.outputs.webflow_components_affected == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Authenticate to Google Cloud (Dev)
        id: auth
        # Also mint an access token: firebase-tools' ADC (external_account)
        # exchange flakes intermittently ("Failed to authenticate"); a minted
        # bearer token passed via --token is reliable (same as the functions
        # jobs). create_credentials_file stays for the gcloud step / ADC.
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/1062803455357/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-deployer@maple-and-spruce-dev.iam.gserviceaccount.com'
          create_credentials_file: true
          token_format: 'access_token'

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Restore node_modules cache
        id: restore-cache
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ needs.prepare_and_build.outputs.cache_key }}

      - name: Install dependencies (fallback)
        if: steps.restore-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Build harness for dev
        # Square sandbox IDs are sourced from .env.dev (public — they
        # ship to every browser that opens the form anyway) so the
        # workflow doesn't fork that source of truth.
        env:
          VITE_TARGET_ENV: dev
        run: |
          export VITE_SQUARE_APPLICATION_ID=$(grep '^SQUARE_APPLICATION_ID=' .env.dev | cut -d= -f2-)
          export VITE_SQUARE_LOCATION_ID=$(grep '^SQUARE_LOCATION_ID=' .env.dev | cut -d= -f2-)
          pnpm exec nx build registration-test-harness

      - name: Ensure Hosting site exists
        # Idempotent — the first deploy after the site is created
        # succeeds; subsequent deploys see "site already exists" and
        # `|| true` swallows the non-zero exit. Stable site name so the
        # Playwright config can hard-code the URL.
        run: |
          npx -y firebase-tools@latest hosting:sites:create \
            maple-spruce-registration-test \
            --project maple-and-spruce-dev \
            --token "${{ steps.auth.outputs.access_token }}" \
            < /dev/null || true

      - name: Deploy harness to dev Hosting
        run: |
          set -o pipefail
          OUT=$(mktemp); trap 'rm -f "$OUT"' EXIT
          if pnpm exec firebase deploy \
            --only hosting:registration-test \
            --project maple-and-spruce-dev \
            --force \
            --token "${{ steps.auth.outputs.access_token }}" 2>&1 | tee "$OUT"; then
            exit 0
          fi
          # Idempotent: this job redeploys the harness on every run, so when the
          # content is byte-identical to what's live (e.g. back-to-back deploys
          # with no harness change) Firebase rejects the release with "is the
          # current active version". The harness is already at the desired
          # state, so treat that specific case as success.
          if grep -q "is the current active version" "$OUT"; then
            echo "::notice::Harness already at the live version — treating as success."
            exit 0
          fi
          exit 1

  deploy_vercel_dev:
    # Auto-deploy the admin web app to the DEV Vercel project on every
    # merge, so business-dev.* always mirrors main — the known-good dev
    # environment we exercise before promoting to prod. Mirrors
    # deploy_vercel_prod but targets the dev project (VERCEL_PROJECT_ID_DEV)
    # and is NOT gated on approval: dev must lead prod, not follow it.
    #
    # vercel.json disables Vercel's own git auto-deploy on main for every
    # project linked to this repo (git.deploymentEnabled.main = false), so
    # without this job the dev project's production domain never updates —
    # it was silently frozen at the last pre-disable commit. Runs
    # unconditionally (no affected gate) so web-only changes — which don't
    # flip the functions `has_changes` flag — still reach dev.
    needs: prepare_and_build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Same flow as deploy_vercel_prod, pointed at the dev project. The
      # dev project's *production* domain is business-dev.*, so `--prod`
      # here promotes to dev — not to the prod project. The dev project's
      # Production env already carries NEXT_PUBLIC_FIREBASE_ENV=dev + the
      # Square sandbox IDs, so `vercel build` bakes the dev config. ORG_ID
      # and TOKEN are shared with prod (same Vercel team); only the project
      # id differs.
      - name: Pull Vercel environment (dev production)
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_DEV }}
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build for Vercel (dev)
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_DEV }}
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to dev Vercel (business-dev)
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_DEV }}
        run: vercel deploy --prebuilt --prod --archive=tgz --token=${{ secrets.VERCEL_TOKEN }}

  e2e_dev:
    # The gate: run the registration E2E suite against the deployed dev
    # backend + deployed harness. Any failure here blocks the prod deploy.
    needs: [prepare_and_build, deploy_functions_dev, deploy_harness_dev]
    # Run if either of the upstream deploys actually executed. Both deploys
    # honor the same conditions (functions or webflow-components affected),
    # so this matches them. `always()` is needed because deploy_functions_dev
    # is conditional and skipping it would otherwise skip this job too.
    if: >-
      always() &&
      (needs.deploy_functions_dev.result == 'success' || needs.deploy_functions_dev.result == 'skipped') &&
      needs.deploy_harness_dev.result == 'success' &&
      (needs.prepare_and_build.outputs.has_changes == 'true' ||
        needs.prepare_and_build.outputs.webflow_components_affected == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Authenticate to Google Cloud (Dev)
        # Needed so the globalSetup's Admin SDK seed can write to dev's
        # Firestore via Application Default Credentials.
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/1062803455357/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-deployer@maple-and-spruce-dev.iam.gserviceaccount.com'
          create_credentials_file: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Pinned to 22.22.3: Node 22.23.0 (security release backporting the
          # http.Agent "response queue poisoning" fix) exposes a node-fetch@2
          # keep-alive regression — false "Premature close" on the concurrent
          # Google auth requests the Admin SDK makes seeding dev Firestore
          # (nodejs/node#63989). 22.22.3 is the last version verified to pass
          # (deploy_all on 22.22.3 succeeded; 22.23.0 fails). Revert to '22'
          # once Node ships the node-fetch keep-alive fix.
          node-version: '22.22.3'
          cache: 'pnpm'

      - name: Restore node_modules cache
        id: restore-cache
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ needs.prepare_and_build.outputs.cache_key }}

      - name: Install dependencies (fallback)
        if: steps.restore-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run registration E2E against dev
        env:
          E2E_TARGET: dev
          HARNESS_BASE_URL: https://maple-spruce-registration-test.web.app
          GOOGLE_CLOUD_PROJECT: maple-and-spruce-dev
        run: pnpm exec nx run registration-e2e:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-dev
          path: |
            apps/registration-e2e/playwright-report/
            apps/registration-e2e/test-results/
          retention-days: 7

  approve_prod:
    # Phase 3 manual gate: every prod-side job depends on this, and this
    # job uses the `production` Environment which is configured (in repo
    # Settings → Environments) with required reviewers. GitHub pauses
    # the job until a reviewer clicks "Review pending deployments".
    #
    # A single gate covers all three prod jobs (functions, webflow,
    # vercel) — one approval click unlocks the whole prod side.
    #
    # Also gated on deploy_vercel_dev: we never promote to prod unless the
    # dev admin app actually deployed, so "known-good dev" includes the web
    # app, not just functions + harness.
    #
    # e2e_dev is SKIPPED for web-app-only merges — it only runs when functions
    # or webflow-components change, since it exercises the registration
    # backend, not the admin portal. Treat that skip as a pass so a
    # frontend-only portal change can still reach this gate; a genuine E2E
    # *failure* (when functions did change) still blocks. `always()` is
    # required because a skipped `needs` would otherwise skip this job too.
    needs: [prepare_and_build, e2e_dev, deploy_vercel_dev]
    if: >-
      always() &&
      needs.deploy_vercel_dev.result == 'success' &&
      (needs.e2e_dev.result == 'success' ||
        (needs.e2e_dev.result == 'skipped' &&
          needs.prepare_and_build.outputs.has_changes != 'true' &&
          needs.prepare_and_build.outputs.webflow_components_affected != 'true' &&
          needs.prepare_and_build.outputs.web_app_affected == 'true'))
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Approved for production deploy
        run: echo "Production deploys unlocked by approver — proceeding."

  deploy_functions_prod:
    needs: [prepare_and_build, approve_prod]
    # `!cancelled()` is required because approve_prod uses `always()` in its
    # own `if` (to survive a skipped e2e_dev on web-app-only merges). A job
    # that depends on an `always()` job is implicitly skipped unless it also
    # uses a status-check function in its `if` — without this, the prod
    # deploy was silently skipped even after approve_prod succeeded.
    if: >-
      !cancelled() &&
      needs.approve_prod.result == 'success' &&
      needs.prepare_and_build.outputs.has_changes == 'true' &&
      needs.prepare_and_build.outputs.matrix != '' &&
      toJson(fromJson(needs.prepare_and_build.outputs.matrix).include) != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      # Deploy ONE codebase at a time. The matrix is one entry per Firebase
      # codebase; running them concurrently makes all four firebase processes
      # submit Cloud Functions operations to the same project at once,
      # saturating the per-project operation queue and triggering 409
      # "unable to queue the operation" races that SILENTLY drop functions
      # (firebase deploy still exits 0). Serializing — plus the 409-aware
      # retry in the deploy step below — makes a full deploy reliable. Normal
      # merges touch only 1–2 codebases, so the cost lands on rare full deploys.
      max-parallel: 1
      # One codebase failing shouldn't cancel the others mid-deploy.
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare_and_build.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Authenticate to Google Cloud (Prod)
        id: auth
        # Keyless WIF access token — see deploy_functions_dev.
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/138840458966/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-deployer@maple-and-spruce.iam.gserviceaccount.com'
          token_format: 'access_token'

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-functions
          path: dist/apps

      - name: Verify download
        run: ls -la dist/apps/

      - name: Restore node_modules cache
        id: restore-cache
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ needs.prepare_and_build.outputs.cache_key }}

      - name: Install dependencies (fallback)
        if: steps.restore-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Copy .env.prod into dist
        run: |
          MAPPING=$(cat function-codebases.json)
          CODEBASES='${{ needs.prepare_and_build.outputs.affected_codebases }}'
          for CODEBASE in $(echo "$CODEBASES" | jq -r '.[]'); do
            PROJECT=$(echo "$MAPPING" | jq -r --arg cb "$CODEBASE" '.codebaseProjects[$cb]')
            cp .env.prod dist/apps/${PROJECT}/.env
          done

      - name: Deploy functions group
        if: matrix.functions != ''
        # Same retry shape as deploy_functions_dev — see there for rationale.
        run: |
          set -o pipefail
          # 409-aware retry — see deploy_functions_dev for the rationale.
          for attempt in 1 2 3 4; do
            # Keyless WIF access token via --token — see deploy_functions_dev.
            pnpm exec firebase deploy \
              --only ${{ matrix.functions }} \
              --project maple-and-spruce \
              --force \
              --token "${{ steps.auth.outputs.access_token }}" 2>&1 | tee /tmp/fb-deploy.log
            status=${PIPESTATUS[0]}
            if [ "$status" -eq 0 ] && ! grep -qiE 'unable to queue the operation' /tmp/fb-deploy.log; then
              exit 0
            fi
            if [ $attempt -lt 4 ]; then
              echo "::warning::firebase deploy attempt $attempt incomplete (exit=$status or 409 contention); retrying in 30s"
              sleep 30
            fi
          done
          echo "::error::firebase deploy failed or left functions undeployed after 4 attempts"
          exit 1

      - name: Skip empty function group
        if: matrix.functions == ''
        run: echo "Skipping deployment for empty function group"

  deploy_firestore_indexes_dev:
    # Same as deploy_firestore_indexes but for the DEV project. Without
    # this, composite indexes only ever reach prod — dev queries that need
    # one fail at runtime with "requires an index", and the emulator never
    # catches it (it doesn't enforce composite indexes). That stayed hidden
    # while the dev web app was frozen; once it went live and called
    # getRoomSchedule, the missing dev index surfaced immediately. Dev must
    # mirror prod for pre-prod verification to mean anything.
    #
    # Independent of the dev→E2E→prod chain (index builds are async and
    # forward-compatible). Runs early so dev has its indexes building as
    # soon as possible.
    runs-on: ubuntu-latest
    if: github.repository == 'Maple-and-Spruce/maple-and-spruce'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if firestore.indexes.json changed
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run — deploying"
            echo "changed=true" >> $GITHUB_OUTPUT
          elif git diff --name-only HEAD~1 HEAD | grep -q '^firestore.indexes.json$'; then
            echo "firestore.indexes.json changed in this push — deploying"
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "firestore.indexes.json unchanged — skipping"
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Authenticate to Google Cloud (Dev)
        id: auth
        if: steps.changed.outputs.changed == 'true'
        # Mint an access token for --token — see deploy_harness_dev (the ADC
        # exchange flakes; a bearer token is reliable).
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/1062803455357/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-deployer@maple-and-spruce-dev.iam.gserviceaccount.com'
          create_credentials_file: true
          token_format: 'access_token'

      - name: Setup gcloud CLI
        if: steps.changed.outputs.changed == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Firestore indexes (dev)
        if: steps.changed.outputs.changed == 'true'
        timeout-minutes: 10
        # No `--force` — same orphan-safety stance as prod (see the prod job).
        # 409-aware retry: see deploy_firestore_indexes (prod) for the full
        # rationale. Same shape, DEV project.
        run: |
          set -o pipefail
          OUTPUT=$(mktemp)
          trap 'rm -f "$OUTPUT"' EXIT

          # firebase-tools deploys declared indexes one create at a time and
          # aborts on the FIRST error. A 409 "index already exists" is benign —
          # the declared index is already present (a prior partial run, an
          # auto-create-URL, or firebase-tools failing to match an index it
          # just created). On the next pass it matches that index and moves on
          # to the rest. So: retry while each attempt errors on a DIFFERENT
          # index (forward progress); fail only if we're stuck on the same 409
          # twice, or hit any non-409 error.
          prev_err=""
          for attempt in $(seq 1 12); do
            npx -y firebase-tools@latest deploy --only firestore:indexes \
              --project maple-and-spruce-dev \
              --token "${{ steps.auth.outputs.access_token }}" \
              < /dev/null 2>&1 | tee "$OUTPUT"
            status=${PIPESTATUS[0]}
            [ "$status" -eq 0 ] && break

            if ! grep -qi "index already exists" "$OUTPUT"; then
              echo "::error::firestore index deploy failed (exit=$status) with a non-409 error"
              exit 1
            fi
            cur_err=$(grep -i "index already exists" "$OUTPUT" | tail -1)
            if [ "$cur_err" = "$prev_err" ]; then
              echo "::error::firestore index deploy stuck on the same 409 — not converging: $cur_err"
              exit 1
            fi
            prev_err="$cur_err"
            echo "::warning::benign 409 (index already exists); declared index is present, retrying ($attempt/12)"
            sleep 15
          done

          # Orphans = indexes in the project but not in firestore.indexes.json.
          # Firebase's wording: "there are N indexes defined in your project
          # that are not present in your firestore indexes file." Surface as a
          # warning (not a hard fail) — orphans are unused, low-risk indexes,
          # and blocking unrelated merges on pre-existing drift is friction.
          # Resolve by declaring them or deleting with gcloud (see message).
          if grep -qi "not present in your firestore indexes file" "$OUTPUT"; then
            echo "::warning title=Firestore index orphans (dev)::Dev has composite indexes not declared in firestore.indexes.json. Resolve by adding them to the file, or delete a stale one with: gcloud firestore indexes composite delete <INDEX_ID> --project maple-and-spruce-dev"
          fi

  deploy_firestore_indexes:
    # Independent of the dev→E2E→prod chain. Index additions take minutes
    # to build on Firestore servers and are forward-compatible (queries
    # work without them, just slower or with errors). The PR-time analyzer
    # enforces declaration; gating here would only add wall-clock time
    # without catching anything new.
    runs-on: ubuntu-latest
    if: github.repository == 'Maple-and-Spruce/maple-and-spruce'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if firestore.indexes.json changed
        id: changed
        run: |
          # On workflow_dispatch we always deploy (caller asked for it).
          # On push, gate on the file actually changing this commit.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run — deploying"
            echo "changed=true" >> $GITHUB_OUTPUT
          elif git diff --name-only HEAD~1 HEAD | grep -q '^firestore.indexes.json$'; then
            echo "firestore.indexes.json changed in this push — deploying"
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "firestore.indexes.json unchanged — skipping"
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Authenticate to Google Cloud
        id: auth
        if: steps.changed.outputs.changed == 'true'
        # Mint an access token for --token — see deploy_harness_dev.
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/138840458966/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-deployer@maple-and-spruce.iam.gserviceaccount.com'
          create_credentials_file: true
          token_format: 'access_token'

      - name: Setup gcloud CLI
        if: steps.changed.outputs.changed == 'true'
        uses: google-github-actions/setup-gcloud@v2

      # firebase-tools is invoked via `npx -y` so we don't need a full pnpm
      # install on this job — keeps it fast (~30s vs ~3min).
      - name: Deploy Firestore indexes
        if: steps.changed.outputs.changed == 'true'
        timeout-minutes: 10
        # We DO NOT pass `--force`. In non-TTY (CI) the "delete extra indexes?"
        # prompt defaults to N — so additions from the file are applied, but
        # any index that exists in prod and not in firestore.indexes.json is
        # left untouched (an "orphan"). Orphans are surfaced as a warning below.
        #
        # Why not `--force`: deletes would be silent and irreversible from
        # this job. A click-the-URL-to-create-an-index workflow (used in
        # incidents) would lose its work on the next unrelated merge.
        #
        # 409-aware retry: firebase-tools creates declared indexes one at a
        # time and aborts on the FIRST error. A 409 "index already exists" is
        # benign — the declared index is already present (a prior partial run,
        # an auto-create-URL, or firebase-tools failing to match an index it
        # just created), which used to fail this job on every merge that
        # touched firestore.indexes.json. We retry while each attempt errors on
        # a DIFFERENT index (forward progress) and fail only if stuck on the
        # same 409 twice or on any non-409 error. Mirrors the functions-deploy
        # 409 retry added in #537.
        run: |
          set -o pipefail
          OUTPUT=$(mktemp)
          trap 'rm -f "$OUTPUT"' EXIT

          prev_err=""
          for attempt in $(seq 1 12); do
            npx -y firebase-tools@latest deploy --only firestore:indexes \
              --project maple-and-spruce \
              --token "${{ steps.auth.outputs.access_token }}" \
              < /dev/null 2>&1 | tee "$OUTPUT"
            status=${PIPESTATUS[0]}
            [ "$status" -eq 0 ] && break

            if ! grep -qi "index already exists" "$OUTPUT"; then
              echo "::error::firestore index deploy failed (exit=$status) with a non-409 error"
              exit 1
            fi
            cur_err=$(grep -i "index already exists" "$OUTPUT" | tail -1)
            if [ "$cur_err" = "$prev_err" ]; then
              echo "::error::firestore index deploy stuck on the same 409 — not converging: $cur_err"
              exit 1
            fi
            prev_err="$cur_err"
            echo "::warning::benign 409 (index already exists); declared index is present, retrying ($attempt/12)"
            sleep 15
          done

          if grep -qi "not present in your firestore indexes file" "$OUTPUT"; then
            echo "::warning title=Firestore index orphans::Prod has composite indexes not declared in firestore.indexes.json. Resolve by adding them to the file, or delete a stale one with: gcloud firestore indexes composite delete <INDEX_ID> --project maple-and-spruce"
          fi

  publish_webflow_components:
    needs: [prepare_and_build, approve_prod]
    # Gate the webflow-components publish on the manual approval (which
    # itself depends on E2E passing). The published bundle becomes the
    # live widget, so it's treated as a prod-side action.
    # `!cancelled()` is required because approve_prod uses `always()` — see
    # deploy_functions_prod for why a status-check function is needed here.
    if: >-
      !cancelled() &&
      needs.approve_prod.result == 'success' &&
      needs.prepare_and_build.outputs.webflow_components_affected == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Restore node_modules cache
        id: restore-cache
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ needs.prepare_and_build.outputs.cache_key }}

      - name: Install dependencies (fallback)
        if: steps.restore-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Share webflow components library
        env:
          WEBFLOW_WORKSPACE_API_TOKEN: ${{ secrets.WEBFLOW_WORKSPACE_API_TOKEN }}
        run: pnpm exec webflow library share --no-input --skip-update-check --manifest apps/webflow-components/webflow.json

  deploy_vercel_prod:
    # Vercel's auto-deploy-on-main is disabled via vercel.json
    # (git.deploymentEnabled.main = false). Prod promotion happens here,
    # gated on the manual approval (which itself requires E2E success).
    # PR previews still auto-deploy from Vercel because the disable only
    # covers `main`.
    needs: approve_prod
    # `!cancelled()` is required because approve_prod uses `always()` — a job
    # depending on an `always()` job is implicitly skipped unless it also uses
    # a status-check function. Without this, deploy_vercel_prod was skipped on
    # #493 despite approve_prod succeeding, so the portal never reached prod.
    if: ${{ !cancelled() && needs.approve_prod.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # `vercel pull` writes .vercel/project.json + the production env
      # to the working dir; `vercel build` and `vercel deploy --prebuilt`
      # both read it. VERCEL_ORG_ID / VERCEL_PROJECT_ID let the link
      # happen non-interactively without a committed .vercel directory.
      - name: Pull Vercel environment (production)
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build for Vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel production
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel deploy --prebuilt --prod --archive=tgz --token=${{ secrets.VERCEL_TOKEN }}
