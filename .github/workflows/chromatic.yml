name: Chromatic

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  NX_DAEMON: 'false'

# Same rationale as build-check.yml: one in-flight run per ref, superseded
# pushes cancelled. Chromatic snapshots are metered, so a cancelled duplicate
# run is also saved quota — this repo has hit the free-tier snapshot cap.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromatic:
    name: Visual Regression Testing
    runs-on: ubuntu-latest
    if: github.repository == 'Maple-and-Spruce/maple-and-spruce'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm exec nx run maple-spruce:build-storybook

      - name: Publish to Chromatic
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          storybookBuildDir: apps/maple-spruce/storybook-static
          exitOnceUploaded: true
