<!--
  Maple & Spruce — Tally email-signup analytics tracking

  Pushes a `generate_lead` event to the GA4 dataLayer AND a `Lead` event to
  Meta Pixel whenever a Tally email-signup popup form is submitted.

  Three forms, two Meta pixels:
    - Maple & Spruce updates (form 0QPRq9)   → M&S pixel 1625932185289127
    - Music Together updates (form q4Qj8d)   → MT  pixel 1562555242035326
    - Suzuki interview request (form QKQb6k) → M&S pixel 1625932185289127

  `category` is sent as Meta `content_category` and must match what
  tallyLeadWebhook sends server-side for the same form — the two events share
  one eventID, and Meta keeps the first one it sees. A Suzuki interview request
  is a `lesson-inquiry`, not a `newsletter`: filing it as the latter tells the
  ad account a $130/month lead is worth the same as an email signup.

  The Meta half always uses `trackSingle`, never a bare `track` — MT pages
  initialize both pixels, and a bare `track` broadcasts to every initialized
  pixel, which would file each MT lead into the Maple & Spruce dataset too.
  See docs/guides/music-together-ad-tracking.md.

  Paste destination:
    Webflow Designer → Site Settings (gear icon) → Custom Code → "Footer Code".

  REPLACE the previous copy of THIS snippet — do not append a second one.
    Appending leaves two `message` listeners on `Tally.FormSubmitted`, which
    double-counts every GA4 `generate_lead`, and — worse — lets the OLDER block
    win the Meta event: both fire with the same `eventID`, Meta keeps the first
    it sees, and the stale block's `content_category` silently overrides the
    correct one. Updating this file then appending it is therefore a no-op that
    looks like a fix.
    Leave unrelated footer code (the GTM noscript block) alone.

  Verify after publishing. The second check is the one that catches a double
  paste, and it must count something that appears EXACTLY ONCE per copy:
    curl -s https://mapleandsprucefolkarts.com/suzuki | grep -c suzuki-interview
    curl -s https://mapleandsprucefolkarts.com/suzuki | grep -c 'MS_PIXEL_ID ='
  Both should print 1; a second copy makes the second command print 2.

  Do NOT grep for `Tally.FormSubmitted` to count copies — it appears twice in
  one correct copy (the indexOf check, and the note below about matching by
  string), so a single good paste reads as 2 and looks broken.

  After pasting:
    1. Save site settings.
    2. Publish the site (top right → Publish).
    3. Verify in GA4 → Admin → DebugView: open the email-signup popup on
       the live site, submit a real or test entry, watch for a
       `generate_lead` event row.
    4. Verify in Meta Events Manager → Test Events: confirm a `Lead` event
       fires for pixel 1625932185289127 (Maple & Spruce signup) and for
       pixel 1562555242035326 (Music Together signup) — each on its own
       pixel only, never both.
    5. In GA4 → Admin → Events: mark `generate_lead` as a conversion event.
       (Without this step the event fires but is not counted as a conversion.)

  Why match by string instead of origin:
    Tally posts the FormSubmitted message from the popup iframe (origin
    https://tally.so) but the popup is also wrapped by Webflow CDN-hosted
    glue scripts that may relay events from the same origin as the page.
    Matching on the literal string "Tally.FormSubmitted" is the pattern
    Tally's own docs recommend and is robust to either path.
-->

<script>
  (function () {
    var MS_PIXEL_ID = '1625932185289127';
    var MT_PIXEL_ID = '1562555242035326';

    // Tally form id -> lead list name + the Meta pixel that owns it. Anything
    // not listed (contact form, class interest, …) falls back to the default so
    // a new one-off form still reports a lead against Maple & Spruce.
    var FORMS = {
      '0QPRq9': {
        name: 'email-signup',
        pixelId: MS_PIXEL_ID,
        category: 'newsletter',
      },
      'q4Qj8d': {
        name: 'music-together-updates',
        pixelId: MT_PIXEL_ID,
        category: 'newsletter',
      },
      QKQb6k: {
        name: 'suzuki-interview',
        pixelId: MS_PIXEL_ID,
        category: 'lesson-inquiry',
      },
    };
    var DEFAULT_FORM = {
      name: 'email-signup',
      pixelId: MS_PIXEL_ID,
      category: 'newsletter',
    };

    // Mirrors ensureMusicTogetherPixel() in music-together-analytics.ts — same
    // window flag, so the MT pixel is init'd at most once per page whether this
    // snippet or an MT widget gets there first.
    function ensureMusicTogetherPixel() {
      if (typeof window.fbq !== 'function') return false;
      if (window.__mtPixelInitialized) return true;
      window.fbq('init', MT_PIXEL_ID);
      window.fbq('trackSingle', MT_PIXEL_ID, 'PageView');
      window.__mtPixelInitialized = true;
      return true;
    }

    window.addEventListener('message', function (event) {
      if (typeof event.data !== 'string') return;
      if (event.data.indexOf('Tally.FormSubmitted') === -1) return;

      var formId = null;
      var submissionId = null;
      try {
        var parsed = JSON.parse(event.data);
        var p = (parsed && parsed.payload) || {};
        formId = p.formId || null;
        // Tally sends the submission id as `id` here and as `data.submissionId`
        // on the webhook — the same value, which is what makes the browser and
        // server Lead events deduplicate against each other.
        submissionId = p.id || null;
      } catch (_e) {
        // not JSON — keep both null and continue
      }

      var form = (formId && FORMS[formId]) || DEFAULT_FORM;

      // GA4 via dataLayer (GTM container GTM-P5NDCZSX forwards to G-TY0E9X31V6).
      // One property covers the whole business; `form_name` separates the lists.
      window.dataLayer = window.dataLayer || [];
      window.dataLayer.push({
        event: 'generate_lead',
        form_id: formId,
        form_name: form.name,
      });

      // Meta Pixel — Lead standard event so Meta can optimize ads for email
      // signups and report on them in Ads Manager. `eventID` is shared with
      // the server-side CAPI Lead from tallyLeadWebhook so Meta counts the
      // signup once instead of twice.
      if (typeof window.fbq !== 'function') return;
      if (form.pixelId === MT_PIXEL_ID && !ensureMusicTogetherPixel()) return;
      window.fbq(
        'trackSingle',
        form.pixelId,
        'Lead',
        { content_name: form.name, content_category: form.category },
        submissionId ? { eventID: 'tally-' + submissionId } : undefined
      );
    });
  })();
</script>
