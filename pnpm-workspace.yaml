packages:
  - 'apps/*'
  - 'libs/**'

allowBuilds:
  '@firebase/util': true
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  less: true
  nx: true
  protobufjs: true
  re2: true
  sharp: true

managePackageManagerVersions: false
minimumReleaseAge: 0
nodeLinker: hoisted
verifyDepsBeforeRun: false
shamefullyHoist: true
strictPeerDependencies: false

# Advisories that cannot be resolved via `overrides` and are consciously
# accepted go under a top-level `auditConfig.ignoreGhsas:` list, which
# `pnpm audit --audit-level=high` (build-check.yml → Security Audit) honors.
# Keep each entry justified; prefer an override every time one exists that
# doesn't break the build. The list is currently empty — GHSA-mh99-v99m-4gvg
# (brace-expansion OOM DoS) was accepted on 2026-07-24 because its only patch
# was 5.0.8, whose CJS entry is API-incompatible with the 1.x/2.x consumers.
# Upstream has since backported it to 1.1.17/2.1.3, so it is now fixed by the
# brace-expansion overrides below and the ignore was removed on 2026-08-07.

overrides:
  # GHSA-r5fr-rjxr-66jc: Code injection via _.template. Transitive dep of html-webpack-plugin, pretty-error, firebase-tools, wait-on. Added 2026-04-01.
  lodash: '>=4.18.0'
  # GHSA-3p68-rc4w-qgx5 (SSRF via NO_PROXY bypass), GHSA-jr5f-v2jv-69x6
  # (header injection cloud-metadata exfil), GHSA-4hjh-wcwx-xvwj (prototype
  # pollution → response tampering / data exfil / request hijacking),
  # GHSA-rfp4-9hxv-h4v3 (header injection via prototype pollution). All
  # patched in axios 1.15.1. Plus GHSA-gcfj-64vw-6mp9 (Node HTTP adapter can
  # use an inherited proxy after interceptor config cloning), patched in
  # 1.18.0. Transitive dep of nx@22.6.5, square@43.2.1, and wait-on. Bumped
  # from >=1.15.1 to >=1.18.0 on 2026-07-24.
  axios: '>=1.18.0'
  # GHSA-7gcc-r8m5-44qm: Host Header Injection via ctx.hostname. Transitive dep of @webflow/webflow-cli > @module-federation/dts-plugin. Added 2026-04-04.
  koa: '>=3.1.2'
  # GHSA-v2wj-q39q-566r (server.fs.deny bypass) and GHSA-p9ff-h696-f583 (arbitrary file read via dev server WebSocket). Transitive dep of @nx/vitest@22.6.4 > vitest@4.1.2. Added 2026-04-07.
  vite@>=7.0.0 <7.3.2: '>=7.3.2'
  # GHSA-chqc-8p9q-pq6q (FTP command injection via CRLF), GHSA-6v7q-wjvx-w8wg (incomplete CRLF protection), and GHSA-rpmf-866q-6p89 (client-side DoS via unbounded multiline control response buffering, patched in 5.3.1). Transitive dep of firebase-tools > proxy-agent > pac-proxy-agent > get-uri. Pinned to 5.x because get-uri targets the 5.x API; 6.0.0 is a major bump. Updated 2026-05-08.
  basic-ftp: '^5.3.1'
  # GHSA-5wm8-gmm8-39j9: fast-xml-builder allows attribute values with unwanted quotes to bypass malicious or unwanted attributes (patched in 1.1.7). Transitive dep of firebase-admin > @google-cloud/storage > fast-xml-parser. Added 2026-05-08.
  fast-xml-builder: '>=1.1.7'
  # GHSA-q3j6-qgpj-74h6: fast-uri vulnerable to path traversal via percent-encoded dot segments (patched in 3.1.1). Plus GHSA-4c8g-83qw-93j6 (host confusion via failed IDN canonicalization, patched in 3.1.3) and GHSA-v2hh-gcrm-f6hx (host confusion via literal backslash authority delimiter, patched in 3.1.4). Transitive dep of @nx/next > @nx/react > @nx/module-federation > ajv. Bumped from >=3.1.1 to >=3.1.4 on 2026-07-24.
  # Plus GHSA-7p8r-x3mc-p8w7 (host confusion via backslash authority introducer),
  # patched per-line in 2.4.4/3.1.5/4.1.2. The unbounded >=3.1.4 selector above
  # had already resolved the whole tree onto the 4.x line (4.1.1), so this is
  # bumped to the 4.x patch and bounded to <5. Bumped on 2026-08-07.
  fast-uri: '>=4.1.2 <5'
  # GHSA-fv7c-fp4j-7gwp: @babel/plugin-transform-modules-systemjs generates arbitrary code when compiling malicious input (patched in 7.29.4). Transitive dep of @nx/* > @nx/js > @babel/preset-env. Added 2026-05-08.
  '@babel/plugin-transform-modules-systemjs': '>=7.29.4'
  # GHSA-66ff-xgx4-vchm (code injection via bytes field defaults),
  # GHSA-75px-5xx7-5xc7 (code generation gadget after prototype pollution),
  # GHSA-jvwf-75h9-cwgg (process-wide DoS via unsafe option paths),
  # GHSA-685m-2w69-288q (DoS via unbounded recursion), plus moderate
  # GHSA-q6x5-8v7m-xcrf (overlong UTF-8), GHSA-2pr8-phx7-x9h3 (DoS via
  # crafted field names), GHSA-fx83-v9x8-x52w (prototype injection in
  # generated constructors). All patched in protobufjs 7.5.6. Plus
  # GHSA-wcpc-wj8m-hjx6 (DoS via unbounded Any expansion during JSON
  # conversion), patched in 8.4.1. Transitive dep of firebase >
  # @firebase/firestore > @grpc/* and firebase-admin >
  # @google-cloud/firestore > google-gax (now on 8.x). Bumped from >=7.5.6
  # to >=8.4.1 on 2026-06-20.
  protobufjs: '>=8.4.1'
  # GHSA-w5hq-g745-h8pq: uuid missing buffer bounds check in v3/v5/v6 when
  # buf is provided (patched in 11.1.1). Transitive dep of firebase-admin.
  # Added 2026-05-12.
  uuid@>=11.0.0 <11.1.1: '>=11.1.1'
  # GHSA-qx2v-qp2m-jg93: PostCSS XSS via unescaped </style> in CSS stringify
  # output (patched in 8.5.10). Plus GHSA-6g55-p6wh-862q (arbitrary file read
  # via attacker-controlled sourceMappingURL in CSS comments, patched in
  # 8.5.12) and GHSA-r28c-9q8g-f849 (path traversal in previous source-map
  # auto-loading → arbitrary .map file disclosure, patched in 8.5.18).
  # Transitive dep of next and @nx/next > next. Bumped from >=8.5.10 to
  # >=8.5.18 on 2026-07-24.
  postcss: '>=8.5.18'
  # GHSA-9vqf-7f2p-gf9v (bodyLimit() bypass for chunked / unknown-length
  # requests) and GHSA-69xw-7hcm-h432 (unvalidated JSX tag names allow HTML
  # injection). Both patched in hono 4.12.16. Plus GHSA-88fw-hqm2-52qc (CORS
  # middleware reflects any Origin with credentials when `origin` defaults to
  # the wildcard), patched in 4.12.25. Transitive dep of firebase-tools >
  # @modelcontextprotocol/sdk. Bumped from >=4.12.16 to >=4.12.25 on 2026-06-20.
  hono: '>=4.12.25'
  # GHSA-v2v4-37r5-5v8g: ip-address XSS in Address6 HTML-emitting methods
  # (patched in 10.1.1). Plus GHSA-mwp4-54f8-5fhr (Address4 decodes leading-zero
  # octets as decimal while resolvers decode them as octal, enabling SSRF /
  # trust-boundary bypass), patched in 10.3.1. Transitive dep of firebase-tools >
  # proxy-agent > socks-proxy-agent > socks and firebase-tools >
  # @modelcontextprotocol/sdk > express-rate-limit. Bumped from >=10.1.1 to
  # >=10.3.1 on 2026-08-07; bounded to the 10.x line.
  ip-address: '>=10.3.1 <11'
  # GHSA covering fast-xml-parser XMLBuilder XML comment / CDATA injection
  # via unescaped delimiters (patched in 5.7.0). Transitive dep of
  # firebase-admin > @google-cloud/storage. Added 2026-05-12.
  fast-xml-parser: '>=5.7.0'
  # GHSA-vpq2-c234-7xj6: @tootallnate/once incorrect control flow scoping
  # (patched in 3.0.1). Transitive (optional) dep of firebase-admin >
  # @google-cloud/* > teeny-request > http-proxy-agent. Added 2026-05-18.
  '@tootallnate/once': '>=3.0.1'
  # GHSA-79cf-xcqc-c78w: webpack-dev-server cross-origin source code
  # exposure on non-HTTPS origins (patched in 5.2.4). Plus GHSA-mx8g-39q3-5c79
  # (HMR WebSocket interception via permissive user proxies), patched in
  # 5.2.5. Dev-only transitive dep of @nx/next > @nx/webpack. Bumped from
  # >=5.2.4 to >=5.2.5 on 2026-07-15. Bounded to the 5.x line (nx's webpack
  # tooling targets webpack-dev-server 5; 6.0.0 is an untested major bump).
  webpack-dev-server: '>=5.2.5 <6'
  # GHSA-jxxr-4gwj-5jf2 (large numeric range defeats the `max` DoS protection,
  # patched 5.0.6), GHSA-3jxr-9vmj-r5cp (exponential-time expansion of
  # consecutive non-expanding {} groups, patched per-line in 1.1.16/2.1.2/5.0.7),
  # GHSA-mh99-v99m-4gvg (unbounded-expansion OOM DoS, now backported per-line to
  # 1.1.17/2.1.3/5.0.8) and GHSA-rgw5-rvv9-x895 / CVE-2026-69152 (DoS via
  # unbounded intermediate arrays, bypassing the CVE-2026-14257 mitigation;
  # patched per-line in 1.1.18/2.1.4/5.0.9). Each brace-expansion major is bumped
  # to its own patched line rather than consolidated, because 5.x cannot replace
  # the 1.x/2.x lines: brace-expansion 5.x's CJS entry exports an OBJECT
  # ({ expand, ... }) whereas 1.x/2.x export the `expand` FUNCTION directly, so
  # the old CJS consumers (@nx/* bundled minimatch, eslint > @eslint/config-array
  # > minimatch@3, firebase-admin > google-gax > rimraf > glob > minimatch) call
  # require('brace-expansion')(...) and crash with "expand is not a function" on
  # 5.x. Upstream has since backported every open advisory to the 1.x and 2.x
  # lines, so the GHSA-mh99-v99m-4gvg auditConfig ignore is no longer needed and
  # was removed. Bumped from 1.1.16/2.1.2/5.0.8 on 2026-08-07.
  brace-expansion@>=1.0.0 <1.1.18: '>=1.1.18 <2'
  brace-expansion@>=2.0.0 <2.1.4: '>=2.1.4 <3'
  brace-expansion@>=3.0.0 <5.0.9: '>=5.0.9 <6'
  # GHSA-58qx-3vcg-4xpx: ws uninitialized memory disclosure (patched in
  # 8.20.1). Plus GHSA-96hv-2xvq-fx4p (memory-exhaustion DoS from tiny
  # fragments and data chunks), patched in 8.21.0. Transitive dep present via
  # several SDKs. Bumped from >=8.20.1 to >=8.21.0 on 2026-06-20.
  ws@>=8.0.0 <8.21.0: '>=8.21.0'
  # GHSA-96hv-2xvq-fx4p also affects the ws 7.x line (patched in 7.5.11),
  # pulled in via firebase-tools. Added 2026-06-20.
  ws@>=7.0.0 <7.5.11: '>=7.5.11'
  # path-to-regexp override
  path-to-regexp@>=2: '>=8.4.0'
  # GHSA-ph9p-34f9-6g65: tmp Path Traversal via unsanitized prefix/postfix
  # enables directory escape (patched in 0.2.6). Transitive dep of
  # firebase-tools and nx. Added 2026-06-07.
  tmp: '>=0.2.6'
  # GHSA-5375-pq7m-f5r2 (malformed request → server crash) and
  # GHSA-99f4-grh7-6pcq (malformed compressed message → client/server crash),
  # both patched in 1.14.4. Transitive dep of firebase > @firebase/firestore.
  # Bumped from >=1.9.16 to >=1.14.4 on 2026-06-20.
  '@grpc/grpc-js': '>=1.14.4'
  # GHSA-w7jw-789q-3m8p: shell-quote quote() does not escape newlines in object
  # .op values (patched in 1.8.4). Plus GHSA-395f-4hp3-45gv (quadratic-complexity
  # DoS in parse(), patched in 1.8.5). concurrently@9.2.1 exact-pins shell-quote
  # 1.8.3; also pulled in via webpack-dev-server > launch-editor. Bumped from
  # >=1.8.4 to >=1.8.5 on 2026-07-24.
  shell-quote: '>=1.8.5'
  # GHSA-vmh5-mc38-953g (TLS certificate validation bypass via dropped
  # requestTls in SOCKS5 ProxyAgent), GHSA-vxpw-j846-p89q (WebSocket client
  # DoS via fragment count bypass), and GHSA-hm92-r4w5-c3mj (cross-origin
  # request routing via SOCKS5 proxy pool reuse). All patched in 7.28.0.
  # Transitive dep of @nx/next > @nx/react > @nx/module-federation >
  # @module-federation/* > undici. Added 2026-06-20. Plus GHSA-4cwx-7wf7-3272
  # (cross-user information disclosure and parse-time crash via degenerate
  # private cache directives), patched in 7.29.0 / 8.9.0. The unbounded >=7.28.0
  # selector had already carried the tree onto the 8.x line (8.5.0), so both
  # vulnerable lines are folded into one selector targeting 8.9.0, bounded to
  # <9. Bumped on 2026-08-07.
  undici@>=7.0.0 <8.9.0: '>=8.9.0 <9'
  # GHSA-fx2h-pf6j-xcff: vite `server.fs.deny` bypass on Windows alternate
  # paths (patched in 8.0.16). The 8.x line is pulled in via @nx/vitest >
  # vitest; the separate vite@7 override above covers the 7.x line.
  # Added 2026-06-20.
  vite@>=8.0.0 <8.0.16: '>=8.0.16'
  # GHSA-hmw2-7cc7-3qxx: form-data CRLF injection via unescaped multipart
  # field names and filenames (patched in 4.0.6). Transitive dep present via
  # several SDKs. Added 2026-06-20.
  form-data@>=4.0.0 <4.0.6: '>=4.0.6'
  # GHSA-hmw2-7cc7-3qxx also affects the form-data 2.x line (patched in
  # 2.5.6), pulled in via firebase-admin > @google-cloud/* > google-gax >
  # retry-request > @types/request. Added 2026-06-20.
  form-data@>=2.0.0 <2.5.6: '>=2.5.6'
  # GHSA-gcq2-9pq2-cxqm: http-proxy-middleware multipart/form-data field
  # injection via unescaped CRLF in `fixRequestBody` (patched in 3.0.7).
  # Added 2026-06-20.
  http-proxy-middleware@>=3.0.4 <3.0.7: '>=3.0.7'
  # GHSA-x9g3-xrwr-cwfg: piscina prototype-pollution gadget → RCE via
  # inherited options.filename (patched in 4.9.3). Transitive dep of @nx/*.
  # Added 2026-06-20.
  piscina@<4.9.3: '>=4.9.3'
  # GHSA-mp2f-45pm-3cg9 (critical): @xhmikosr/decompress archive extraction
  # can create files and links outside the target directory (Zip Slip)
  # (patched in 11.1.3). Transitive dep of @swc/cli > @xhmikosr/bin-wrapper >
  # @xhmikosr/downloader > @xhmikosr/decompress. Added 2026-07-06.
  '@xhmikosr/decompress@>=11.0.0 <11.1.3': '>=11.1.3'
  # GHSA-xcpc-8h2w-3j85: adm-zip crafted ZIP triggers 4GB memory allocation
  # DoS (patched in 0.6.0, current latest). Dev-only transitive dep of
  # @nx/next > @nx/react > @nx/module-federation > @module-federation/*
  # > @module-federation/dts-plugin and @webflow/webflow-cli. Added 2026-07-17.
  adm-zip: '>=0.6.0'
  # GHSA-xv26-6w52-cph6 (critical): websocket-driver message corruption via
  # abuse of protocol length headers, plus resource-limit bypass via message
  # compression. Both patched in 0.7.5. Transitive dep of firebase &
  # firebase-admin > @firebase/database > faye-websocket. Added 2026-07-15.
  websocket-driver@<0.7.5: '>=0.7.5'
  # GHSA-q8mj-m7cp-5q26: qs remotely triggerable DoS — qs.stringify crashes
  # on null/undefined entries in comma-format arrays when encodeValuesOnly is
  # set (patched in 6.15.2). Transitive dep present via several SDKs.
  # Added 2026-07-15.
  qs@>=6.11.1 <=6.15.1: '>=6.15.2'
  # GHSA-q7cg-457f-vx79: joi uncaught RangeError on deeply nested input
  # through recursive link() schemas (patched in 18.2.1). Transitive dep of
  # firebase-admin > @google-cloud/*. Added 2026-07-15.
  joi@<18.2.1: '>=18.2.1'
  # GHSA-vmf3-w455-68vh: node-tar applies PAX size override to intermediary
  # GNU long-name/long-link headers, causing a parser interpretation
  # differential / file smuggling (patched in 7.5.16). Transitive dep of nx &
  # firebase-tools. Added 2026-07-15.
  tar@<7.5.16: '>=7.5.16'
  # GHSA-4vj7-5mj6-jm8m: morgan log forging via unneutralized control
  # characters in :remote-user (patched in 1.10.2; first published fix is
  # 1.11.0). Transitive dep present via express tooling. Added 2026-07-15.
  morgan@<1.10.2: '>=1.10.2'
  # GHSA-h67p-54hq-rp68: js-yaml quadratic-complexity DoS in merge-key
  # handling via repeated aliases. Patched in 3.15.0 (3.x line) and 4.1.2
  # (4.x line). Plus GHSA-52cp-r559-cp3m (merge-key chains force quadratic CPU
  # consumption), patched in 4.3.0 (4.x line). Transitive dep of many dev/build
  # tools. 4.x bumped from >=4.1.2 to >=4.3.0 on 2026-07-24. Plus
  # GHSA-5p4m-2wfm-xmqj (quadratic CPU consumption in !!omap resolution — the
  # CVE-2026-59870 fix was not backported), patched in 3.15.1 / 4.3.1. Bumped
  # from 3.15.0/4.3.0 on 2026-08-07.
  js-yaml@>=3.0.0 <3.15.1: '>=3.15.1 <4'
  js-yaml@>=4.0.0 <4.3.1: '>=4.3.1 <5'
  # GHSA-v6wh-96g9-6wx3: launch-editor NTLMv2 hash disclosure via UNC path
  # handling on Windows (patched in 2.14.1). Dev-only transitive dep of
  # webpack-dev-server. Added 2026-07-15.
  launch-editor@<2.14.1: '>=2.14.1'
  # GHSA-64mm-vxmg-q3vj: http-proxy-middleware `router` host+path substring
  # matching allows Host-header-driven backend routing bypass (2.x line
  # patched in 2.0.10; the 3.x override above covers GHSA-gcq2 separately).
  # Dev-only transitive dep of webpack-dev-server 5. Bounded to the 2.x line
  # so it stays compatible with webpack-dev-server's ^2 range. Added 2026-07-15.
  http-proxy-middleware@>=0.16.0 <2.0.10: '>=2.0.10 <3'
  # GHSA-p63j-vcc4-9vmv (critical): @vitest/browser Browser Mode provider
  # commands bypass the file-access permission gate (patched in 4.1.10).
  # Dev-only transitive dep of @nx/vitest > vitest > @vitest/browser-playwright
  # and @vitest/coverage-v8. Scoped to the 4.x line vitest resolves. Added 2026-07-24.
  '@vitest/browser@>=4.0.0 <4.1.10': '>=4.1.10 <5'
  # GHSA-v56q-mh7h-f735 (List 32-bit trie overflow → unrecoverable DoS) and
  # GHSA-xvcm-6775-5m9r (hash-collision algorithmic-complexity DoS in Map/Set),
  # both patched in immutable 5.1.8. Transitive dep of next > sass and
  # @nx/vitest > vite > sass. Scoped to the vulnerable 5.x line. Added 2026-07-24.
  immutable@>=5.0.0-beta.1 <5.1.8: '>=5.1.8 <6'
  # GHSA-6gpp-xcg3-4w24 (middleware/proxy bypass with Turbopack + single
  # locale), GHSA-m99w-x7hq-7vfj (DoS in App Router Server Actions),
  # GHSA-89xv-2m56-2m9x (SSRF in Server Actions on custom servers), and
  # GHSA-p9j2-gv94-2wf4 (SSRF in rewrites via attacker-controlled destination
  # hostname). All patched in next 16.2.11. Direct dep (16.2.6) plus @nx/next
  # and @storybook/nextjs-vite. Added 2026-07-24.
  next@>=16.0.0 <16.2.11: '>=16.2.11 <17'
  # GHSA-f88m-g3jw-g9cj: sharp inherits libvips vulnerabilities CVE-2026-33327,
  # CVE-2026-33328, CVE-2026-35590, CVE-2026-35591 (patched in 0.35.0).
  # Transitive dep of next. Scoped to the pre-0.35 line. Added 2026-07-24.
  sharp@<0.35.0: '>=0.35.0'
  # GHSA-2p49-hgcm-8545: SVGO removeScripts plugin leaves some executable
  # scripts intact. Patched in 3.3.4 (3.x line, via @svgr/webpack) and 4.0.2
  # (4.x line, via @nx/webpack > cssnano > postcss-svgo). Dev-only build
  # tooling. Added 2026-07-24.
  svgo@>=3.0.0 <3.3.4: '>=3.3.4 <4'
  svgo@>=4.0.0 <4.0.2: '>=4.0.2 <5'
