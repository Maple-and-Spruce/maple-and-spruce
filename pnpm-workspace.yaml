packages:
  - 'apps/*'
  - 'libs/**'

allowBuilds:
  '@firebase/util': true
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  less: true
  nx: true
  protobufjs: true
  re2: true
  sharp: true

managePackageManagerVersions: false
minimumReleaseAge: 0
nodeLinker: hoisted
verifyDepsBeforeRun: false
shamefullyHoist: true
strictPeerDependencies: false

# Security overrides — keep this list SHORT.
#
# Before adding one, check the vulnerable package is not simply stale: delete
# node_modules AND pnpm-lock.yaml (pnpm 11 keeps a copy of the lockfile in
# node_modules and will reuse it), `pnpm install`, then `pnpm audit`. On
# 2026-09-29 that alone cleared ~45 of the 50 overrides this file used to carry
# — the lockfile was holding old transitive versions long after their parents
# had moved to patched ranges. Only add an override when a parent pins the
# vulnerable version *exactly* (or to a range that excludes the fix), and name
# that parent so the entry can be deleted when it moves.
#
# Each override is bounded to the major line its parent expects.
#
# Accepted, not overridden (below the `--audit-level=high` gate that
# build-check.yml → Security Audit enforces; revisit when the parent moves):
#   - @opentelemetry/core 1.x (GHSA-8988-4f7v-96qf, moderate): the fix is 2.x;
#     firebase-tools > @google-cloud/pubsub still depends on 1.x.
#   - uuid 9.x (GHSA-w5hq-g745-h8pq, moderate): the fix is 11.x; firebase-admin
#     > @google-cloud/storage > gaxios still depends on 9.x. Only the buf-arg
#     form of v3/v5/v6 is affected, which gaxios does not call.
#   - elliptic 6.6.1 (GHSA-848j-6mx2-7j84, low): no patched release exists;
#     webflow-api > crypto-browserify.

# A HIGH advisory with no patched release anywhere cannot be overridden away;
# it is accepted here, with the reason, and `pnpm audit` reports it as ignored.
auditConfig:
  ignoreGhsas:
    # braces <=3.0.3: stack exhaustion on deeply nested brace patterns. No
    # patched release exists (latest is 3.0.3, advisory has no fix). braces
    # only expands glob patterns written in our own build-tool configs
    # (micromatch under fast-glob, webflow-cli, firebase-tools, nx), never
    # request input, and it is in no production dependency tree
    # (`pnpm why braces --prod` is empty). Accepted 2026-10-04; swap for an
    # override once 3.0.4 ships.
    - GHSA-vfj7-8cjw-p6xm

overrides:
  # @webflow/webflow-cli@1.x > @module-federation/enhanced@0.20.0 >
  # @module-federation/dts-plugin pins adm-zip 0.5.x, koa 3.0.1 and (via
  # isomorphic-ws) ws 8.18.0. webflow-cli 2.x still pins adm-zip 0.5.10 and
  # form-data 4.0.4, so upgrading the CLI does not retire these.
  #   adm-zip: GHSA-xcpc-8h2w-3j85, GHSA-7q85-xj36-vmfc, GHSA-j5f4-cc29-5x44,
  #            GHSA-rcw4-f5rp-g42v, GHSA-vwc7-r8mq-g2x9 (all fixed in 0.6.1)
  #   koa:     GHSA-7gcc-r8m5-44qm (3.1.2), GHSA-g8mr-fgfg-5qpc (3.0.3)
  #   ws:      GHSA-96hv-2xvq-fx4p (8.21.0), GHSA-58qx-3vcg-4xpx (8.20.1)
  adm-zip@<0.6.1: '>=0.6.1 <0.7'
  koa@>=3.0.0 <3.1.2: '>=3.1.2 <4'
  ws@>=8.0.0 <8.21.0: '>=8.21.0 <9'
  # @webflow/webflow-cli pins form-data 4.0.4 exactly.
  # GHSA-hmw2-7cc7-3qxx (CRLF injection in multipart field names), fixed in 4.0.6.
  form-data@>=4.0.0 <4.0.6: '>=4.0.6 <5'
  # nx@23.2.1 pins smol-toml 1.6.1 exactly. GHSA-7w5x-hrqm-74c2 (DoS on
  # malformed TOML), fixed in 1.7.1. nx only parses TOML files from this repo.
  smol-toml@<1.7.1: '>=1.7.1 <2'
  # nx@23.2.1 (latest) pins axios 1.18.1 exactly. GHSA-3pq3-5fj3-cg6v,
  # GHSA-542g-h47m-68v8, GHSA-mghh-pgcx-3jjj, GHSA-x97p-jq2g-jp4f,
  # GHSA-m8m8-qj5v-23w3, GHSA-c29m-xwm3-cm6r, GHSA-r4gj-5m52-g5wh, all
  # fixed in 1.20.0. Added 2026-10-04.
  axios@<1.20.0: '>=1.20.0 <2'
  # nx@23.2.1 pins brace-expansion 5.0.9 exactly. GHSA-6j4f-fj2g-mc7p (5.0.10)
  # and GHSA-qhr7-859c-m2p7 (5.0.11). Scoped to the 5.x line: the 1.x/2.x
  # lines are unaffected, and 5.x cannot replace them (its CJS entry exports an
  # object, not the expand function). Added 2026-10-04.
  brace-expansion@>=5.0.0 <5.0.11: '>=5.0.11 <6'
  # @firebase/firestore depends on @grpc/grpc-js ~1.9.0. GHSA-m9gg-hp2v-232j
  # (getAuthContext can report unauthorized certificates as authorized), fixed
  # in 1.13.6 / 1.14.5. main overrode the 1.9 line onto 1.14 before this
  # refresh, so the jump is proven. Added 2026-10-04.
  '@grpc/grpc-js@<1.14.5': '>=1.14.5 <2'
  # firebase-tools > proxy-agent > pac-proxy-agent > get-uri depends on
  # basic-ftp ^5. GHSA-c475-qrg2-pj4r (quadratic CPU in Client.list()) is
  # fixed only in 6.2.1. 6.x's one breaking change refuses separate FTP
  # transfer hosts by default, a security default get-uri does not rely on.
  # Added 2026-10-04.
  basic-ftp@<6.2.1: '>=6.2.2 <7'

# material-react-table 3.2.1 (still latest) passes props MUI 9 removed and now
# ignores: the table search box would lose its icon and clear button, and its
# menus their list settings. The patch renames them to MUI 9's slotProps in
# both dist builds. The inline cell editor is left unpatched because no table
# here enables editing. Delete the patch when MRT supports MUI 9; pnpm refuses
# to apply it to any other version, so a bump forces the check. Tracked in #166.
patchedDependencies:
  material-react-table@3.2.1: patches/material-react-table@3.2.1.patch
